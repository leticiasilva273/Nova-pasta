<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctum — Escudo do Mestre</title>
<style>
  :root{
    --ground:#1d1710;      /* turfa: fundo da mesa */
    --sheet:#261e15;       /* folha do personagem */
    --sheet-2:#2f2519;     /* bloco de segredos */
    --ink:#e9dcc0;         /* pergaminho */
    --muted:#a8966f;
    --gold:#d2a656;        /* luz de vela: só seleção e foco */
    --line:#4a3a28;
    --blood:#7d2f28;       /* segredos e Vilão */
    --blood-ink:#dd9a8f;
    --pv:#9cc39a;
    --pd:#8fb0d4;
    --serif-display:"Palatino Linotype","Book Antiqua",Palatino,serif;
    --serif-text:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--serif-text);
    font-size:1.0625rem;
    line-height:1.7;
  }
  .masthead{
    max-width:1120px;margin:0 auto;padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  h1{
    margin:0;font-family:var(--serif-display);font-weight:normal;
    font-size:2rem;line-height:1.1;color:var(--ink);
  }
  .sub{margin:4px 0 0;color:var(--muted);font-style:italic;font-size:.95rem}
  .aviso{
    display:block;margin:10px 0 0;color:var(--blood-ink);
    font-style:italic;font-size:.88rem;
  }
  #busca{
    width:100%;margin:18px 0 0;padding:8px 0;
    background:transparent;color:var(--ink);
    border:0;border-bottom:1px solid var(--line);border-radius:0;
    font:inherit;font-size:1.05rem;
  }
  #busca::placeholder{color:var(--muted);font-style:italic}
  #busca:focus{outline:none;border-bottom-color:var(--gold)}
  #contagem{margin:6px 0 0;min-height:1.2em;color:var(--muted);font-size:.88rem;font-style:italic}

  .layout{max-width:1120px;margin:0 auto;padding:0 20px}
  nav{padding:14px 0 6px}
  .group{margin-top:18px}
  .group h2{
    margin:0 0 4px;font-size:.92rem;font-weight:normal;font-style:italic;
    color:var(--muted);
  }
  .tabbar{display:flex;flex-wrap:wrap;gap:4px}
  .tab{
    background:transparent;color:var(--ink);
    border:0;border-bottom:2px solid transparent;border-radius:0;
    padding:8px 4px;font:inherit;font-size:1rem;cursor:pointer;
    min-height:44px;text-align:left;
  }
  .tab:hover{color:var(--gold)}
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
  .tab.vilao{color:var(--blood-ink)}
  .tab.vilao[aria-selected="true"]{color:#f0b9ae;border-bottom-color:var(--blood-ink)}

  main{padding:18px 0 48px}
  .panel{
    background:var(--sheet);border:1px solid var(--line);
    padding:24px 20px 18px;
    animation:sheetIn .22s ease-out;
  }
  @keyframes sheetIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .panel h2{
    margin:0;font-family:var(--serif-display);font-weight:normal;
    font-size:1.9rem;line-height:1.1;color:var(--ink);
  }
  .cargo{margin:6px 0 0;color:var(--muted);font-style:italic}
  .block{border-top:1px solid var(--line);margin-top:20px;padding-top:12px}
  .block h3{
    margin:0 0 6px;font-family:var(--serif-display);font-weight:normal;
    font-size:1.02rem;color:var(--gold);
  }
  .block p{margin:.5em 0;max-width:62ch}
  .block ol,.block ul{margin:.4em 0 .4em 1.3em;padding:0}
  .block li{margin:.4em 0;max-width:62ch}
  .block.seg{
    border-top:none;margin-top:22px;padding:12px 14px;
    background:var(--sheet-2);border-left:2px solid var(--blood);
  }
  .block.seg h3{color:var(--blood-ink)}

  .retrato{display:block;width:min(100%,260px);height:auto;margin:0 auto 12px;border-radius:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);margin:8px 0 2px}
  @media (min-width:640px){.stats{grid-template-columns:repeat(6,1fr)}}
  .stat{padding:8px 4px 10px;text-align:center;border-bottom:1px solid var(--line)}
  .stat .k{display:block;font-size:.84rem;font-style:italic;color:var(--muted)}
  .stat strong{display:block;font-family:var(--serif-display);font-size:1.6rem;font-weight:normal;line-height:1.2}
  .stat.pv strong{color:var(--pv)}
  .stat.pd strong{color:var(--pd)}
  .block.ficha{margin-top:18px}
  .block.ficha h4{
    margin:14px 0 2px;font-size:.95rem;font-weight:normal;font-style:italic;color:var(--muted);
  }
  .block.ficha ul{margin:.1em 0 .1em 1.2em;padding:0}
  .block.ficha li{margin:.15em 0}
  .block.ficha ul.pericias{columns:2 200px;column-gap:32px}
  .block.ficha ul.pericias li{break-inside:avoid}
  .block.aula p{margin:.5em 0;max-width:62ch}
  .block.aula strong{font-weight:normal;font-style:italic;color:var(--muted)}
  .mestre{
    margin-top:14px;padding:12px 14px;
    background:var(--sheet-2);border-left:2px solid var(--blood);
  }
  .mestre h4{margin:0 0 4px;font-family:var(--serif-display);font-weight:normal;font-size:1.02rem;color:var(--blood-ink)}
  .mestre p{margin:.4em 0;max-width:62ch}
  .block.personalidade p{margin:.5em 0;max-width:62ch}
  .block.personalidade .frase{font-style:italic;color:var(--muted)}
  .block.detalhe p{margin:.5em 0;max-width:62ch}
  .block.detalhe strong{font-weight:normal;font-style:italic;color:var(--muted)}
  /* Ficha da jogadora: dados em grade, perícias em duas colunas */
  .jogadora .jog-dados{display:grid;grid-template-columns:max-content 1fr;gap:8px 22px;margin:10px 0 0}
  .jogadora .jog-dados dt{font-style:italic;color:var(--muted)}
  .jogadora .jog-dados dd{margin:0}
  .jogadora ul.pericias{columns:2 200px;column-gap:32px;margin:.4em 0 .4em 1.2em}
  .jogadora ul.pericias li{break-inside:avoid}
  .jogadora .sub-linha{color:var(--muted);font-style:italic}
  .jogadora .poder-linha{display:block}
  /* Bíblia: subtítulos internos e listas */
  .biblia .block h4{
    margin:1.5em 0 .1em;font-family:var(--serif-display);font-weight:normal;font-size:1.18rem;line-height:1.25;color:var(--ink);
  }
  .biblia .block li{margin:.5em 0}
  .biblia .block ul ul{margin-top:.2em;margin-bottom:.2em}
  .biblia .block em{color:var(--muted)}
  .achado{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-left:2px solid var(--line);background:var(--sheet-2)}
  .achado.encontrado{border-left-color:var(--gold)}
  .achado p{margin:.3em 0;max-width:62ch}
  .achado strong,.local .npc strong{font-weight:normal;font-style:italic;color:var(--muted)}
  .achado-nome{font-family:var(--serif-display);font-size:1.02rem;color:var(--ink)}
  .local h5{margin:14px 0 0;font-weight:normal;font-style:italic;color:var(--muted);font-size:.95rem}
  .local .npc{margin:.4em 0}
  .marca{
    margin-top:8px;background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:2px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer;min-height:36px;
  }
  .marca:hover{color:var(--gold);border-color:var(--gold)}
  .marca:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .marca[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
  .filtro{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
  .chip{
    background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:2px;
    padding:6px 10px;font:inherit;font-size:.92rem;cursor:pointer;min-height:36px;
  }
  .chip:hover{border-color:var(--gold)}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
  .zona{border-top:1px solid var(--line);margin-top:22px;padding-top:10px}
  .zona h3{margin:0 0 4px;font-family:var(--serif-display);font-weight:normal;font-size:1.1rem;color:var(--gold)}
  .local{margin:12px 0;padding-left:12px;border-left:1px solid var(--line)}
  .local h4{margin:0;font-family:var(--serif-display);font-weight:normal;font-size:1.02rem}
  .local p{margin:.3em 0;max-width:62ch}
  .mestre-linha{color:var(--blood-ink)}
  .mestre-linha strong{font-weight:normal;font-style:italic}

  /* Links para as abas dos NPCs */
  .npc-link{
    color:var(--gold);text-decoration:underline dotted;text-underline-offset:4px;
    text-decoration-thickness:1px;cursor:pointer;position:relative;
  }
  .npc-link:hover,.npc-link:focus-visible{text-decoration-style:solid}
  .npc-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .npc-link::after{
    content:attr(data-cargo);position:absolute;left:0;bottom:calc(100% + 6px);z-index:5;
    width:max-content;max-width:240px;padding:4px 8px;
    background:var(--sheet-2);color:var(--ink);border:1px solid var(--line);
    font-size:.82rem;font-style:italic;line-height:1.35;white-space:normal;
    opacity:0;pointer-events:none;transition:opacity .15s ease;
  }
  .npc-link:hover::after,.npc-link:focus-visible::after{opacity:1}
  #vazio{
    padding:28px 10px;text-align:center;color:var(--muted);font-style:italic;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  footer{text-align:center;color:var(--muted);font-size:.85rem;font-style:italic;padding:0 20px 28px}

  /* Desktop: índice fixo à esquerda, folha à direita */
  @media (min-width:900px){
    .layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px;align-items:start}
    nav{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-top:24px}
    main{padding-top:24px}
    .tabbar{flex-direction:column;gap:0}
    .tab{border-bottom:0;border-left:2px solid transparent;padding:6px 10px;min-height:36px}
    .tab[aria-selected="true"]{border-left-color:var(--gold);border-bottom-color:transparent}
    .tab.vilao[aria-selected="true"]{border-left-color:var(--blood-ink)}
    .panel{padding:36px 40px 28px}
    .masthead{padding-top:36px}
    h1{font-size:2.6rem}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<header>
  <div class="masthead">
    <h1>Sanctum — Escudo do Mestre</h1>
    <p class="sub">Dunraven Hall, Escócia, 1996. Campanha de Ordem Paranormal.</p>
    <span class="aviso">Uso privado do mestre</span>
    <input id="busca" type="search" placeholder="Buscar por nome, cargo ou qualquer palavra… (sem acento também)" aria-label="Buscar NPCs e conteúdos" autocomplete="off">
    <p id="contagem" aria-live="polite"></p>
  </div>
</header>

<div class="layout">
  <nav id="tabs" role="tablist" aria-label="Personagens"></nav>
  <main>
    <div id="panels"></div>
    <div id="vazio" hidden>Nenhum resultado</div>
  </main>
</div>

<footer>Escudo do mestre · não mostrar aos jogadores</footer>

<script src="biblia-dunraven.js"></script>
<script src="roteiro-mestre.js"></script>
<script>
const FICHAS = {
  "malcolm-ross":  {nivel:3, F:6, M:8, E:8, PV:12, PD:14, pericias:{"Persuasão":8,"Disciplina":10,"Aptidão":10,"Intimidar":6}, itens:"anel de ouro com o brasão; chave do gabinete; livro de atas", ataques:"—", poderes:"Argumento certo; Sangue-frio"},
  "gerald-hunt":   {nivel:2, F:6, M:8, E:6, PV:10, PD:10, pericias:{"Inspecionar":10,"Percepção":8,"Intimidar":6}, itens:"lanterna; prancheta; relógio de bolso; molho de chaves; apito", ataques:"Bastão de madeira — Luta 6 — 1d6", poderes:"Preparo; Mão firme"},
  "agnes-bell":    {nivel:2, F:6, M:6, E:8, PV:10, PD:12, pericias:{"Intuição":10,"Percepção":8,"Disciplina":8,"Medicina":6}, itens:"molho de chaves; lanterna; kit de primeiros socorros; bíblia de bolso", ataques:"—", poderes:"Consolo; Argumento certo"},
  "peter-doyle":   {nivel:3, F:8, M:6, E:6, PV:14, PD:12, pericias:{"Luta":10,"Intimidar":8,"Percepção":8,"Crime":6}, itens:"cassetete; lanterna; maço de cigarros; chaves do posto", ataques:"Cassetete — Luta 10 — 1d6+1", poderes:"Desforra; Reflexo"},
  "angus-reid":    {nivel:2, F:6, M:8, E:8, PV:10, PD:12, pericias:{"Sobrevivência":10,"Percepção":10,"Pontaria":6}, itens:"molho de chaves mestras; lanterna; livro de entradas; boina e capa encerada (Bran, o cão, é companheiro)", ataques:"Machado de lenha — Luta 6 — 1d8", poderes:"Sentidos aguçados; Olhar atento"},
  "helena-prado":  {nivel:2, F:6, M:8, E:8, PV:10, PD:12, pericias:{"Persuasão":10,"Enganação":8,"Aptidão":8}, itens:"passaporte; cartões telefônicos; caderno de contatos; cartas da Fundação Lumen", ataques:"—", poderes:"Argumento certo; Vínculo forte"},
  "adrian-lowe":   {nivel:3, F:6, M:10, E:8, PV:12, PD:14, pericias:{"Aptidão":10,"Persuasão":8,"Intuição":8,"Percepção":6}, itens:"livro de bolso (Byron); caderno; cachecol; panfleto original da Assembleia Livre", ataques:"—", poderes:"Olhar sensível; Leitura de pessoas"},
  "isobel-grant":  {nivel:3, F:6, M:10, E:6, PV:12, PD:12, pericias:{"Aptidão":10,"Inspecionar":10,"Intuição":8,"Bruxaria":6}, itens:"óculos de leitura; pasta de arquivos; colar de pérolas; chave de arquivo da família Grant", ataques:"—", poderes:"Memória do passado; Leitura rápida"},
  "simon-clarke":  {nivel:2, F:4, M:10, E:8, PV:8, PD:12, pericias:{"Aptidão":10,"Disciplina":8,"Percepção":6}, itens:"edição de Homero; giz; gravata-borboleta; partitura da capela", ataques:"Bengala — Luta 4 — 1d4", poderes:"Memória do passado"},
  "fiona-kerr":    {nivel:3, F:8, M:10, E:6, PV:14, PD:12, pericias:{"Medicina":10,"Aptidão":10,"Sobrevivência":8,"Percepção":8}, itens:"kit de laboratório; bisturi; lupa; caderno de campo; maço de Marlboro", ataques:"Bisturi — Luta 6 — 1d4", poderes:"Análise rápida; Primeiros socorros"},
  "hugh-martin":   {nivel:2, F:6, M:8, E:8, PV:10, PD:12, pericias:{"Persuasão":10,"Intimidar":8,"Disciplina":8,"Enganação":6}, itens:"pasta de couro; abotoaduras de ouro; charuto", ataques:"—", poderes:"Argumento certo; Vínculo forte"},
  "silas-moore":   {nivel:4, F:6, M:10, E:6, PV:14, PD:14, pericias:{"Aptidão":10,"Inspecionar":10,"Furtividade":8,"Intimidar":6}, itens:"chave da Arca; luvas brancas de algodão; lanterna; livro de registros de empréstimos", ataques:"Estilete — Luta 6 — 1d4", poderes:"Preparo; Mão firme; Resistência"},
  "daniel-burke":  {nivel:2, F:6, M:8, E:8, PV:10, PD:12, pericias:{"Aptidão":8,"Intuição":8,"Disciplina":8,"Persuasão":6}, itens:"caneca de chá; Bíblia; cruz peitoral", ataques:"—", poderes:"Consolo; Argumento certo"},
  "luc-renard":    {nivel:2, F:6, M:8, E:10, PV:10, PD:14, pericias:{"Persuasão":10,"Enganação":8,"Aptidão":8}, itens:"lenços coloridos; programa da peça de inverno; maquiagem de palco", ataques:"—", poderes:"Canção; Olhar sensível"},
  "julian-hale":   {nivel:2, F:8, M:6, E:8, PV:12, PD:12, pericias:{"Luta":8,"Intimidar":8,"Persuasão":8,"Atletismo":6}, itens:"anel de sinete de prata; relógio caro; florete de esgrima", ataques:"Florete — Luta 8 — 1d6+1", poderes:"Investida; Vínculo forte"},
  "victoria-martin":{nivel:1, F:6, M:8, E:8, PV:8, PD:10, pericias:{"Enganação":8,"Persuasão":8,"Intuição":6,"Aptidão":6}, itens:"caderno de poemas; cigarro; perfume", ataques:"—", poderes:"Olhar sensível"},
  "callum-ross":   {nivel:1, F:8, M:6, E:8, PV:10, PD:10, pericias:{"Furtividade":6,"Crime":6,"Percepção":6,"Aptidão":6}, itens:"walkman com fitas; jaqueta; canivete", ataques:"—", poderes:"Reflexo"},
  "megan-doyle":   {nivel:1, F:8, M:6, E:6, PV:10, PD:8, pericias:{"Sobrevivência":8,"Atletismo":6,"Percepção":6,"Furtividade":6}, itens:"capa de chuva amarela; botas de borracha; lanterna; faca de pescador", ataques:"Faca de pescador — Luta 6 — 1d6", poderes:"Sentidos aguçados"},
  "rory-kerr":     {nivel:2, F:6, M:8, E:8, PV:10, PD:12, pericias:{"Aptidão":10,"Disciplina":8,"Percepção":6}, itens:"distintivo de monitor; livro de poesia; óculos redondos; apito", ataques:"—", poderes:"Teimosia; Leitura rápida"},
  "lucy-bell":     {nivel:1, F:4, M:8, E:8, PV:6, PD:10, pericias:{"Percepção":8,"Furtividade":8,"Inspecionar":6,"Aptidão":6}, itens:"caderno de desenho; lápis; lanterna pequena; suéter da avó", ataques:"—", poderes:"Olhar atento"},

        "Lowe distribui cópias mimeografadas, ainda com cheiro de álcool, e pede que um aluno leia em voz alta, de preferência um bolsista, “para ouvirmos Burns com outro sotaque”. Poema: A Red, Red Rose (Robert Burns, 1794).",
        "O my Luve is like a red, red rose / That's newly sprung in June; / O my Luve is like the melodie / That's sweetly play'd in tune.",
        "So fair art thou, my bonnie lass, / So deep in luve am I; / And I will luve thee still, my dear, / Till a' the seas gang dry.",
        "Till a' the seas gang dry, my dear, / And the rocks melt wi' the sun; / I will luve thee still, my dear, / While the sands o' life shall run.",
        "And fare thee weel, my only luve! / And fare thee weel awhile! / And I will come again, my luve, / Though it were ten thousand mile.",
        "Tradução para a mesa: Meu amor é como uma rosa vermelha, vermelha, que acabou de abrir em junho; meu amor é como a melodia tocada docemente, afinada. Tão linda és tu, minha menina, tão fundo no amor estou eu; e vou te amar ainda, minha querida, até que todos os mares sequem. Até que todos os mares sequem, querida, e as rochas derretam com o sol; vou te amar ainda, minha querida, enquanto correrem as areias da vida. Adeus, meu único amor! Adeus, por um tempo! E eu voltarei, meu amor, nem que seja a dez mil milhas."]},
      {t:"3. Perguntas (objetivo 1)", ol:true, body:[
        "“Byron diz que a noite foi feita para amar, mas decide parar. Por quê? O que a noite custa?”",
        "“Burns promete amar até os mares secarem. Isso é uma promessa ou uma ameaça?”",
        "“Um poema fala de parar, o outro de nunca parar. Qual dos dois é mais corajoso?”",
        "Quem responder com sinceridade, sem precisar estar certo, cumpre o objetivo. Lowe odeia resposta decorada: “Isso é o que o livro diz. Eu perguntei o que você acha.”"]},
      {t:"4. Análise em dupla (objetivo 2)", body:[
        "Dez minutos. Cada dupla escolhe um dos poemas e responde: que imagem deste poema vocês levariam para casa, e por quê? No fim, cada dupla diz a sua imagem em uma frase."]},
      {t:"5. Banco do Poeta (objetivo 3)", body:[
        "A turma desce até a falésia com casacos e cachecóis, sob o vento. Lowe sobe no banco de pedra e pede que cada um recite um verso de memória, de qualquer um dos dois poemas, virado para o mar.",
        "Teste: Persuasão ou Aptidão (Artes), DT 7. Lowe aplaude todo mundo, mas a quem errar diz baixinho: “Não leia o poema. Deixe o poema ler você. Tenta de novo.” Cada aluno pode tentar uma segunda vez."]},
      {t:"Bônus da aula", body:[
        "Os 3 objetivos: Inspirado, +2 em um teste de Mente ou Emoção, à escolha do jogador, até o fim da próxima sessão, e recupera 1 PD. Além disso, ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Mente ou Emoção até o fim da sessão.",
        "1 ou nenhum: nada, mas Lowe guarda o nome e chama o aluno para ler na próxima aula."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "No fim da aula, Lowe chama o aluno de lado: “Você recita bem. Lembra alguém. Tem um veterano, o Vane, que recita Byron como se tivesse conhecido o homem pessoalmente. Ele recitou esse mesmo poema numa reunião de poesia nas ruínas, ano passado. Um grupo de alunos que se encontra à noite. Eu não deveria saber disso. Você também não.”",
        "Com isso o jogador fica sabendo da Vigília, de que o Elias a lidera, e de que ela se reúne nas ruínas à noite."]},
      {t:"Ligação com a trama (só para o mestre)", seg:true, body:[
        "O poema de Byron é um aviso: fala de parar de vagar à noite, “por mais que o coração ame”. Quando o jogador for convidado para a Vigília, lembre este verso.",
        "A rosa de Burns é o contraponto da rosa negra do Elias: a de Burns é um amor que volta mesmo de longe; a do Elias é um amor que prende. Se um jogador perceber isso em voz alta, dê +1 no placar contra o Encanto.",
        "Callum Ross está na turma e recita perfeitamente, de olho baixo. Rory Kerr assiste da porta, fingindo que está só de passagem."]}
    ]},
    { id:"grant", g:1, name:"Prof. Isobel Grant", role:"História (medieval e moderna) (52 anos)", blocks:[
      {t:"Resumo", body:[
        "Descendente do reitor Alexander Grant, fundador da Biblioteca Grant. Intelectual brilhante, fria e irônica.",
        "Pesquisa os arquivos do castelo e sabe mais do que deveria."]},
      {t:"Aparência", body:["Alta e elegante, cabelo preto com fios brancos num corte reto até o queixo, batom escuro. Blazer preto, colar de pérolas e óculos de leitura numa corrente."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Desconfia de Elias Vane por causa dos arquivos da família. Pode ser aliada na pesquisa da Arca ou um obstáculo, conforme o mestre."]},
      {t:"Aula: Culloden e o que o arquivo não diz", body:[
        "História (medieval e moderna), terça-feira, 11h. Sala do 2º andar, ala sul. A parte histórica de Culloden é real; os documentos do arquivo são da campanha."]},
      {t:"Objetivos da aula", ol:true, body:[
        "Responder à pergunta de abertura com uma ideia própria, não decorada.",
        "Analisar um documento em dupla: dizer o que ele prova e o que ele não prova.",
        "Achar a passagem no mapa: localizar a passagem da adega no mapa de 1760."]},
      {t:"1. A pergunta de abertura", body:[
        "Grant entra pontualmente, fecha a porta (quem chegar depois fica do lado de fora até o intervalo) e escreve no quadro, sem dizer bom dia: “Em 16 de abril de 1746, perderam-se cerca de 1.500 homens em menos de uma hora. Quantos deles estão nos arquivos desta Casa?”",
        "Ela espera em silêncio até alguém arriscar. A resposta certa é “não sabemos”, e ela só aceita se o aluno explicar por quê: os arquivos são escritos por quem sobreviveu e por quem tinha algo a esconder.",
        "“Ótimo. A pergunta mais honesta da História é ‘como você sabe disso?’. O resto é decoração.”"]},
      {t:"2. O contexto (10 minutos, real)", body:[
        "1745: Carlos Eduardo Stuart, o “Bonnie Prince Charlie”, desembarca na Escócia e reúne os clãs das Highlands para tomar o trono britânico de volta para os Stuart.",
        "16 de abril de 1746: Batalha de Culloden, perto de Inverness. O exército jacobita, cansado e faminto, é destruído pelas tropas do governo sob o Duque de Cumberland em menos de uma hora. É a última batalha campal travada em solo britânico.",
        "Depois: fugitivos caçados por toda a Escócia. Em 1746, o governo aprova leis que proíbem o tartã e as armas nas Highlands. O modo de vida dos clãs começa a acabar.",
        "“Os vencedores escreveram a História. Os perdedores se esconderam em grutas. E alguns desses perdedores se esconderam a três quilômetros desta sala.”"]},
      {t:"3. O documento (objetivo 2)", body:[
        "Documento A — Livro de Registro do Reitor, 2 de maio de 1746 (caligrafia apressada): “Recebemos sob este teto três cavalheiros vindos do norte, feridos, cujos nomes não escrevo. Estão guardados onde a maré guarda. O irmão L. leva-lhes pão e notícias. Que Deus e o Silêncio nos perdoem.”",
        "Documento B — Rol dos Custodes da Ordo Clavis, maio de 1746 (sete nomes; três riscados com tinta mais escura, todos no mesmo dia): “Custodes: Wm. Moray · J. Grant · A. Ferguson · (riscado) R. Ogilvie · (riscado) D. Keith · (riscado) T. Burnett · Fr. L. — descenderunt, non redierunt (desceram, não voltaram), 29 de maio.”",
        "Pergunta para cada dupla: o que estes documentos provam? E o que eles NÃO provam? Provam que o Colégio escondeu jacobitas, que eles estavam num lugar ligado ao mar e que três Custodes “desceram e não voltaram” no mesmo dia. Não provam quem eram os jacobitas, o que aconteceu com eles nem quem é o “irmão L.” / “Fr. L.”.",
        "Quem perceber que o “L.” aparece nos dois documentos e não tem sobrenome recebe um olhar longo de Grant e uma nota de canto no caderno dela."]},
      {t:"4. O mapa (objetivo 3)", body:[
        "Grant projeta a planta do castelo de 1760, da Sala de Mapas, e pergunta: “Se vocês fossem esconder três homens ‘onde a maré guarda’, por onde os levariam?” Ela chama um aluno ao quadro.",
        "Teste: Inspecionar ou Aptidão (Erudição), DT 8, para achar a escada atrás da adega desenhada no mapa.",
        "Se errar: “Não. Mas obrigada por me mostrar como os jacobitas morreram.” Ela anota o nome do aluno. Se acertar: fica em silêncio um segundo longo demais, desliga o projetor e diz: “Correto. Essa escada foi tapada em 1802. Supostamente.”"]},
      {t:"Bônus da aula", body:[
        "Os 3 objetivos: Método de Arquivo, +2 em testes de Inspecionar ou Aptidão (pesquisa em documentos) até o fim da próxima sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Inspecionar ou Aptidão até o fim da sessão.",
        "1 ou nenhum: nada, e Grant passa uma leitura extra de quarenta páginas “para corrigir a ignorância”."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "No fim da aula, Grant pede que o aluno fique para “ajudar a guardar os slides”. Com a porta fechada: “Você viu o ‘L.’. Ninguém vê o ‘L.’. O meu tataravô escreveu num diário, em 1771, que havia ‘um irmão L. que nunca envelhecia’. Em 1888, um tutor de piano chamado Edward Lyall esteve nesta Casa. Duas semanas atrás, eu vi um aluno assinar Vane com a mesma inclinação na letra. Eu posso estar louca. Mas, se você encontrar o nome Lyall em qualquer lugar deste castelo, me procure. Não procure mais ninguém.”",
        "O jogador sai sabendo do nome Lyall, da suspeita sobre o Elias e do quadro de datas de Grant, além de ganhar uma aliada de pesquisa."]},
      {t:"Ligação com a trama (só para o mestre)", seg:true, body:[
        "O “irmão L.” dos Documentos A e B é Carne, disfarçado como irmão da Ordem da Chave em 1746. A mesma pessoa que levava pão aos jacobitas os matou, e depois afogou os três Custodes riscados.",
        "Esta aula adianta para o Ato 2 parte da Cena 12 (As Datas). Se os jogadores forem bem aqui, a Cena 12 pode ser mais curta.",
        "Silas Moore fez as fotocópias. Se perceber que Grant usou o Documento B, conta ao Elias, e isso pode antecipar a Cena 15."]}
    ]},
    { id:"clarke", g:1, name:"Prof. Simon Clarke", role:"Latim e Grego (67 anos)", blocks:[
      {t:"Resumo", body:[
        "Velho, distraído e apaixonado por Homero. Exige recitações de memória dos alunos.",
        "Toca piano na capela à noite."]},
      {t:"Aparência", body:["Gordinho, cabelo branco ralo e despenteado, óculos grossos e gravata-borboleta torta. A beca vive manchada de giz."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Era professor de David Shaw em 1957 e nunca superou o incêndio. Ouve coisas na capela quando toca à noite. Pode ser testemunha dos fenômenos ligados à lenda do órgão que toca sozinho às 3h."]},
      {t:"Aula: Os Mortos que Bebem", body:[
        "Latim e Grego, quarta-feira, 8h. Sala do 1º andar, ao lado da Sala Columba. A Odisseia é de domínio público; o grego e a tradução podem ir para a mesa. Canto XI: a descida ao mundo dos mortos."]},
      {t:"Objetivos da aula", ol:true, body:[
        "Recitar de memória o primeiro verso da Odisseia em grego (o dever da aula anterior).",
        "Completar a tradução no quadro com a turma: acertar pelo menos uma palavra.",
        "Responder à pergunta final sobre o Canto XI."]},
      {t:"1. A chamada recitada (objetivo 1)", body:[
        "Clarke chega cinco minutos atrasado, com a beca torta e uma xícara de chá na mão, e começa sem cumprimentar: “Senhor… ahn… senhorita… você, de óculos. Odisseia, canto I, verso 1. Comece.” Ele chama um por um, em ordem, inclusive os bolsistas, cujos nomes ele erra sempre (“Senhor Torres… Tavares… Torres!”).",
        "O verso a decorar: Ἄνδρα μοι ἔννεπε, Μοῦσα, πολύτροπον… Ándra moi énnepe, Moûsa, polýtropon… “Canta-me, Musa, o homem de muitos caminhos…”",
        "Teste: Disciplina, DT 7. Quem acerta ganha um “Excelente! Homero chora de alegria.” Quem erra ouve: “Ah, não se preocupe, o erro é só o primeiro verso que você ainda não decorou. Quarta que vem, de novo.”"]},
      {t:"2. O Canto XI no quadro (objetivo 2)", body:[
        "Clarke explica a Nekyia, a descida ao mundo dos mortos: “Odisseu precisa falar com os mortos. E o que os mortos querem, meus jovens? Querem lembrar. Mas os mortos não lembram de nada, são sombras vazias. Para que uma sombra fale, ela precisa beber… sangue.”",
        "Ele escreve no quadro um resumo com lacunas: Odisseu cava uma cova, derrama nela o ______ (sangue) de um carneiro negro, e as sombras dos mortos sobem do Érebo, aos milhares, gritando. Ele as afasta com a ______ (espada), e só deixa beber quem ele quer ouvir. Quem bebe o sangue ______ (lembra / fala), e conta a verdade.",
        "Quem acertar pelo menos uma lacuna cumpre o objetivo. Clarke fica tão empolgado que recita, de olhos fechados, alguns versos em grego que ninguém acompanha."]},
      {t:"3. A pergunta final (objetivo 3)", body:[
        "“Em Homero, os mortos precisam de sangue para lembrar quem eram. Então lhes pergunto: o que acontece com quem bebe o sangue dos vivos para não esquecer… e nunca morre?”",
        "Qualquer resposta pensada cumpre o objetivo. Se alguém disser “vira um monstro” ou “vira um vampiro”, Clarke ri, mas os olhos dele não riem: “Ah, os jovens e as suas histórias de fantasma.”"]},
      {t:"Bônus da aula", body:[
        "Os 3 objetivos: Memória de Homero, +2 em testes de Disciplina ou de Vontade/Emoção contra medo ou encanto até o fim da próxima sessão. “Quem decora não esquece quem é.” E ganha a pista abaixo.",
        "2 objetivos: +1 em Disciplina até o fim da sessão.",
        "1 ou nenhum: nada, e o aluno precisa decorar os três primeiros versos para quarta que vem."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "Enquanto a turma sai, Clarke segura o braço do aluno com a mão trêmula: “Você tem boa memória. Eu tive um aluno assim, em 1957. David Shaw. Decorava constelações como quem decora poemas. Ele me disse, uma semana antes de morrer, que um rapaz subia ao Observatório à noite sem fazer barulho na escada. Eu disse a ele que era imaginação. Eu toco piano na capela todas as noites desde então, até a uma da manhã. E às três, quando eu já parei… o órgão toca sozinho. Três notas. Eu nunca contei isso a ninguém.”",
        "O jogador fica sabendo de David Shaw, do rapaz no Observatório em 1957 e de que o órgão das 3h não é o Clarke. Isso aponta para a Prof.ª Munro, que anota as três notas."]},
      {t:"Ligação com a trama (só para o mestre)", seg:true, body:[
        "O Canto XI é o espelho do Carne: os mortos de Homero bebem sangue para lembrar quem eram, e Carne bebe sangue para nunca esquecer e nunca morrer. Se um jogador ligar as duas coisas em voz alta, dê +1 contra o Encanto do Elias.",
        "Elias, se cursar algo com Clarke, recita o Canto XI inteiro em grego com uma pronúncia antiga que Clarke nunca ouviu de ninguém. Clarke fica encantado e não percebe o perigo.",
        "Esta aula pode substituir a cena do Armistício (Cena 13 do cronograma) como o momento em que os jogadores descobrem David Shaw."]}
    ]},
    { id:"kerr", g:1, name:"Dr. Fiona Kerr", role:"Biologia e Ciências Naturais; também Geografia e Geologia (41 anos)", blocks:[
      {t:"Resumo", body:[
        "Cética, moderna e fumante. Dirige o Laboratório Kerr e colabora com o Instituto Roslin.",
        "Defende os bolsistas nas reuniões da reitoria."]},
      {t:"Aparência", body:["Loira, cabelo curto e prático, sem maquiagem. Jaleco sobre jeans e botas Dr. Martens. Um maço de Marlboro no bolso."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Bissexual e discreta: foi casada com um geólogo até 1992 e é confidente de Morag. Colaborou com o Instituto Roslin, onde nasceu a ovelha Dolly. Aliada natural de Bianca Nunes; pode analisar restos e marcas encontrados nas cavernas."]},
      {t:"Aula: Hematologia Básica, o Sangue ao Microscópio", body:[
        "Biologia e Ciências Naturais, 1º ano. Quinta-feira, 14h às 16h. Laboratório Kerr.",
        "Material na bancada de cada dupla: microscópio óptico, lâminas e lamínulas, lancetas descartáveis, álcool, algodão, corante de Giemsa, óleo de imersão, luvas e uma ficha de laboratório mimeografada."]},
      {t:"Objetivos da aula", ol:true, body:[
        "Seguir o protocolo (luvas, jaleco, nada na boca) sem ser avisado.",
        "Fazer um esfregaço legível (teste da Parte 2).",
        "Identificar corretamente as lâminas de comparação (teste da Parte 3)."]},
      {t:"Parte 1: aula expositiva (40 min)", body:[
        "Kerr fala de pé, desenhando no quadro com giz colorido. “Boa tarde. Hoje é sangue. Quem desmaia com sangue, sente perto da porta, que eu não carrego ninguém.”",
        "“O sangue é um tecido. Um tecido líquido, mas um tecido. Se vocês centrifugarem um tubo de sangue, ele se separa em duas partes. Em cima, uns 55%: o plasma. Amarelado, é quase todo água, com proteínas, sais, açúcar, hormônios. Embaixo, uns 45%: as células. Escrevam isso.”",
        "Hemácias (glóbulos vermelhos): discos achatados, sem núcleo nos mamíferos. Levam oxigênio, com a hemoglobina. Duram cerca de 120 dias.",
        "Leucócitos (glóbulos brancos): maiores, com núcleo. Defesa do corpo. Duram de horas a anos, conforme o tipo.",
        "Plaquetas: fragmentos pequenos de células. Coagulação. Duram cerca de 10 dias.",
        "“As hemácias são o caminhão de entrega. Não têm núcleo, nos mamíferos, para caber mais hemoglobina. Atenção, porque isso cai na prova: aves, répteis, peixes e anfíbios têm hemácias COM núcleo. Se vocês olharem uma lâmina e virem hemácia com núcleo, não é sangue de gente.”",
        "“Os leucócitos são o exército. São cinco tipos, e vocês vão decorar os cinco: neutrófilos, os mais comuns, que atacam bactérias; linfócitos, que fazem os anticorpos; monócitos, os maiores, que engolem o lixo; eosinófilos, que lutam contra parasitas e aparecem nas alergias; basófilos, os mais raros. Num sangue normal, de cada cem leucócitos, uns sessenta são neutrófilos e uns trinta são linfócitos.”",
        "“Agora, anemia. Anemia é pouca hemoglobina no sangue. A mais comum é por falta de ferro. Sintomas: palidez, cansaço, falta de ar, frio nas mãos, sono demais, dificuldade de concentração. Se algum de vocês estiver assim depois das noites desta faculdade, a culpa é do toque de recolher, não do ferro.”",
        "“Por último: o sangue fora do corpo morre. Coagula em minutos se não tiver anticoagulante. As células começam a se deformar em horas. Uma lâmina corada se conserva, mas as células não ficam como estavam vivas. Sangue velho parece sangue velho. Lembrem disso daqui a uma hora.”"]},
      {t:"Parte 2: prática, o esfregaço (50 min)", ol:true, body:[
        "Higiene: luvas, limpar a ponta do dedo com álcool.",
        "Coleta: furar a ponta do dedo com a lanceta (cada aluno do próprio dedo) e colocar uma gota pequena na ponta da lâmina.",
        "Esfregaço: com outra lâmina inclinada a 45°, encostar na gota e deslizar num movimento só, rápido e firme. O sangue tem que ficar como uma língua fina, mais fina na ponta.",
        "Secagem: deixar secar ao ar por dois minutos. Não soprar.",
        "Coloração: cobrir com corante de Giemsa por dez minutos e lavar com água.",
        "Observação: começar com o aumento menor; depois, uma gota de óleo de imersão e o aumento de 1.000 vezes.",
        "Registro: desenhar na ficha uma hemácia, um neutrófilo e um linfócito, com legenda.",
        "“Quem fizer o esfregaço grosso vai ver uma pilha de hemácias e nada mais. Esfregaço é como manteiga no pão: fino, numa passada só.”",
        "Teste: Aptidão (Ciências) ou Medicina, DT 7, para fazer um esfregaço legível. Quem falha pode refazer uma vez."]},
      {t:"Parte 3: lâminas de comparação (20 min)", body:[
        "Kerr distribui três lâminas prontas, numeradas, e pede que cada dupla diga de onde é cada uma: Lâmina 1: sangue de frango, hemácias com núcleo, ovais. Lâmina 2: sangue humano de um aluno anêmico, com a etiqueta tapada, hemácias pálidas e pequenas. Lâmina 3: sangue humano com a etiqueta “E.V. — 1994 — exame de admissão”.",
        "Teste: Medicina ou Percepção, DT 8. Sucesso: a dupla identifica o frango (núcleo) e a anemia (hemácias pálidas). E percebe que a lâmina 3 está errada: as células de 1994 estão perfeitas, como se fossem de hoje, e não há nenhum leucócito.",
        "Se alguém falar isso em voz alta, Kerr se aproxima, olha no microscópio por tempo demais, recolhe a lâmina e diz: “Erro de etiqueta. Acontece. Próxima dupla.”"]},
      {t:"Parte 4: fechamento e dever de casa (10 min)", body:[
        "“Para a semana que vem: relatório de duas páginas, à mão, com os desenhos do esfregaço de vocês e a resposta a três perguntas.” No quadro: 1. Por que as hemácias dos mamíferos não têm núcleo? 2. Cite os cinco tipos de leucócitos e a função de cada um. 3. Um paciente está pálido, cansado e com sono o dia todo. Que exame você pediria, e o que esperaria ver no esfregaço?",
        "“E lavem as lâminas. Quem deixar sangue seco na minha bancada faz o relatório em dobro.”"]},
      {t:"Bônus da aula", body:[
        "Os 3 objetivos: Rigor de Laboratório, +2 em testes de Medicina ou Inspecionar (vestígios, ferimentos, marcas) até o fim da próxima sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Medicina ou Percepção até o fim da sessão.",
        "1 ou nenhum: nada, e o aluno lava todos os frascos da bancada."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "Depois da aula, atrás do laboratório, com um cigarro aceso: “Aquela lâmina não tinha erro de etiqueta. É do Vane. Exame de admissão. Sangue de dois anos não fica assim, e sangue humano tem leucócito. Aquele não tinha nenhum. E a lâmina 2, a do anêmico? É de um menino daquele clube de poesia dele. Metade do clube está assim. Eu sou cientista, não acredito em fantasma. Mas se você me trouxer mais uma coisa que eu não consiga explicar, eu começo a acreditar.”"]},
      {t:"Para o mestre", seg:true, body:[
        "A aula ensina aos jogadores, sem eles perceberem, os sintomas da anemia: palidez, cansaço, frio, sono. Depois disso, eles vão reconhecer os membros da Vigília, e talvez a si mesmos, se estiverem com o livro do Elias.",
        "A pergunta 3 do dever de casa é a mesma situação de quem está sendo mordido. Se um jogador responder pensando num colega da Vigília, Kerr anota o nome dele.",
        "Se Bianca Nunes estiver na turma (ela faz Biologia), é ela quem nota a lâmina 3 primeiro."]}
    ]},
    { id:"martin", g:1, name:"Prof. Hugh Martin", role:"Direito; também Economia e Administração (55 anos)", blocks:[
      {t:"Resumo", body:[
        "Aristocrata e conservador, pai de Victoria Martin. Representa a velha guarda.",
        "Desconfia dos bolsistas e prefere a tradição à reforma."]},
      {t:"Aparência", body:["Alto, cabelos penteados para trás com gel e nariz aquilino. Ternos risca de giz de Londres e abotoaduras de ouro."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Pai de Victoria, que foi “chamada” pelos Carrick. Pode ser alvo de chantagem ou aliado dos Carrick, conforme o mestre."]},
      {t:"Aula: Introdução ao Direito Escocês e o Método do Caso", body:[
        "Direito, 1º ano. Segunda-feira, 14h às 16h. Sala de madeira escura, 2º andar, ala sul.",
        "Material: cópias mimeografadas do caso Donoghue v Stevenson, o Estatuto e Regulamento Interno de Dunraven, uma toga e uma peruca de juiz (que ele empresta ao aluno que fizer de juiz)."]},
      {t:"Objetivos da aula", ol:true, body:[
        "Responder corretamente a pelo menos uma das perguntas do caso Donoghue.",
        "Argumentar no tribunal simulado (passar no teste de Persuasão ou fazer de juiz).",
        "Citar um artigo do Estatuto com o número certo durante o debate."]},
      {t:"Parte 1: aula expositiva (35 min)", body:[
        "Martin fala sentado, de pernas cruzadas, sem levantar a voz. “Senhoras e senhores. A primeira coisa que um advogado aprende na Escócia é que ele não é inglês.”",
        "“O direito escocês é um sistema misto. De um lado, o direito romano, que os nossos juristas estudaram nos Países Baixos e na França nos séculos XVI e XVII: códigos, princípios, lógica. Do outro, a common law, o direito dos precedentes, que veio com a convivência com a Inglaterra. O resultado é um sistema que não é nem continental nem inglês. É nosso.”",
        "“Quando o Parlamento escocês se uniu ao inglês, em 1707, o Ato de União garantiu duas coisas que interessam a vocês: os tribunais escoceses continuariam existindo, e o direito privado escocês continuaria escocês. Foi o preço da União. Escrevam: Ato de União, 1707, artigos 18 e 19.”",
        "“Os tribunais. Para causas civis, a Court of Session, em Edimburgo. Para causas criminais, a High Court of Justiciary. Acima deles, para as causas civis, a Câmara dos Lordes, em Londres. Os advogados que falam nesses tribunais chamam-se advocates. Os juízes chamam-se Lords. Sim, todos eles. Não, isso não os torna aristocratas. Infelizmente.”",
        "Quadro de conceitos: Precedente, decisão de um tribunal superior que obriga os inferiores em casos semelhantes. Ratio decidendi, a razão da decisão: a parte que vira regra. Obiter dictum, o que o juiz disse de passagem: não obriga, mas pesa. Delict, no direito escocês, o dano causado a outra pessoa por culpa (o tort inglês)."]},
      {t:"Parte 2: o caso (35 min)", body:[
        "“O caso mais famoso do direito britânico do século XX começou com uma garrafa de cerveja de gengibre. E é escocês.” Donoghue v Stevenson (1932), que é real: em agosto de 1928, May Donoghue foi com uma amiga a um café em Paisley, perto de Glasgow. A amiga lhe pagou uma cerveja de gengibre numa garrafa escura, que não deixava ver o conteúdo.",
        "Depois de beber metade, ela despejou o resto no copo e saiu dali um caramujo em decomposição. Ela passou mal. Não podia processar o café por contrato, porque não tinha comprado nada: quem pagou foi a amiga. Então processou o fabricante, David Stevenson.",
        "O caso foi até a Câmara dos Lordes, que decidiu a favor dela por 3 votos a 2. Lord Atkin criou o princípio do vizinho: você deve tomar cuidado razoável para não causar dano a quem pode ser previsivelmente afetado pelo que você faz.",
        "“Até 1932, quem não tinha contrato não tinha direito. Depois daquele caramujo, todo fabricante do Império passou a dever cuidado a quem nunca viu na vida. Uma escocesa de Paisley mudou o direito de um império com um caramujo. Nunca subestimem um caso pequeno.”",
        "Perguntas para a turma: 1. Qual é a ratio decidendi do caso? (O fabricante deve cuidado razoável ao consumidor final, mesmo sem contrato.) 2. Por que a Sra. Donoghue não podia processar o café? (Ela não tinha contrato com o café.) 3. Quem é o seu “vizinho”, no sentido de Lord Atkin?"]},
      {t:"Parte 3: tribunal simulado (40 min)", body:[
        "“Agora vocês vão argumentar. E vão argumentar sobre esta Casa.” Caso simulado: Aluna X contra o Colégio Dunraven. Um funcionário do Colégio abriu a carta pessoal de uma aluna no escaninho, sem autorização, e guardou uma cópia num arquivo disciplinar. A aluna pede a destruição da cópia e uma punição para o funcionário. O Colégio alega que a carta podia conter prova de uma falta disciplinar e invoca o Silentium (Art. 61-63).",
        "Time da Aluna: baseia-se no Art. 12 (direito a receber correspondência sem violação) e no Art. 14 (vida privada). Time do Colégio: baseia-se no Art. 43 (inspeção em caso de urgência ou suspeita fundada), no Art. 62 (dever de comunicar acontecimentos incomuns) e no Silentium. Juiz: um aluno, com a toga e a peruca, que decide no fim e precisa dar a ratio da decisão.",
        "Teste: Persuasão (ou Diplomacia, conforme o seu sistema), DT 8, para o argumento principal de cada time. O juiz faz um teste de Intuição, DT 7, para dar uma decisão bem fundamentada.",
        "Martin não diz quem tem razão. No fim, só comenta: “O Art. 43 fala de inspeção de quartos, não de cartas. O Art. 12 não tem exceção. Quem defendeu o Colégio defendeu bem, e estava errado. Isso também acontece nos tribunais, e com frequência.”"]},
      {t:"Parte 4: fechamento e dever de casa (10 min)", body:[
        "“Para segunda que vem: uma página sobre o caso Donoghue, com a ratio decidendi em uma frase. E uma lista de três situações nesta Casa em que alguém deve cuidado razoável a outra pessoa. Sejam criativos. Sejam precisos.”"]},
      {t:"Bônus da aula", body:[
        "Os 3 objetivos: Precedente, +2 em testes de Persuasão ou Diplomacia em discussões formais com autoridades (Reitor, Hunt, Senatus, Court of Governors) até o fim da campanha, uma vez por sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em Persuasão com a Reitoria até o fim da sessão.",
        "1 ou nenhum: nada, e Martin pede o dever de casa em dobro, “com caligrafia legível desta vez”."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "Martin chama o aluno à mesa enquanto os outros saem: “Você argumentou bem. Não gosto do seu programa de bolsas, mas gosto de quem lê o regulamento. Um conselho de graça: o caso que eu dei hoje não é tão hipotético quanto parece. Se alguém nesta Casa estiver abrindo cartas alheias, isso é falta grave contra o Estatuto. E a Court of Governors tira até um Vice-Reitor do cargo por isso. Eu não disse nada. O senhor também não ouviu nada.”",
        "O jogador fica sabendo que Hunt está violando correspondência. Essa é a arma para salvar a Dra. Morag Lindsay no arco dela. Também fica sabendo que Martin não gosta de Hunt, e que ele pode ser um aliado inesperado da velha guarda."]},
      {t:"Para o mestre", seg:true, body:[
        "O caso simulado é exatamente o que Hunt fez com a carta da Kirsty para a Morag. Se os jogadores ligarem as duas coisas, eles têm o argumento jurídico para derrubar Hunt.",
        "Martin é conservador, mas é um homem de regras: ele detesta Hunt porque Hunt quebra o Estatuto. Isso o torna previsível e explorável.",
        "Se Victoria Martin estiver assistindo da porta (ela faz o curso de Direito do 2º ano), ela vê o pai elogiando um bolsista. Nunca o viu fazer isso.",
        "Se Diego Torres estiver na turma (ele faz Direito), Martin o chama de “senhor Torres, o gaúcho” e o põe no time do Colégio, para ver se ele consegue defender o que não acredita."]}
    ]},
    { id:"moore", g:1, name:"Mr. Silas Moore", role:"Bibliotecário (aparenta uns sessenta)", blocks:[
      {t:"Resumo", body:[
        "Guarda a chave da Arca, que divide com o reitor. Magro, voz rouca e luvas de algodão o tempo todo.",
        "Neutro, misterioso e estranhamente bem-informado. Controla o balcão da Biblioteca Grant e as fichas de empréstimo."]},
      {t:"Aparência", body:["Muito pálido e magro, rosto encovado, cabelo grisalho ralo. Luvas brancas de algodão, colete preto e voz rouca. Nunca parece envelhecer nas fotos antigas."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Servo antigo e cansado de Thomas Carne. Apaga registros, troca fichas e desvia investigações. Pode virar aliado ou traidor."]}
    ]},
    { id:"burke", g:1, name:"Fr. Daniel Burke", role:"Capelão católico (44 anos)", blocks:[
      {t:"Resumo", body:[
        "Gentil, sofre de insônia e ouve confissões informais dos alunos no escritório da sacristia.",
        "Está sempre com uma caneca de chá."]},
      {t:"Aparência", body:["Rosto gentil, olheiras profundas e cabelo castanho rareando. Colarinho clerical, cardigã marrom e uma caneca de chá sempre na mão."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Gay e celibatário, vive uma fé sincera e uma solidão enorme. Não revela a ninguém os segredos que ouve. Recebe confissões que revelam segredos dos alunos. Pode ser fonte de informação valiosa ou testemunha do que acontece à noite."]}
    ]},
    { id:"renard", g:1, name:"Monsieur Luc Renard", role:"Francês e Teatro (36 anos)", blocks:[
      {t:"Resumo", body:[
        "Belga e extravagante. Dirige a peça de inverno, em dezembro.",
        "Aliado de Lowe."]},
      {t:"Aparência", body:["Moreno, cabelo comprido preso num rabo, brinco na orelha esquerda, lenços coloridos no pescoço e casaco de veludo vinho."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Gay, e vive em segredo com Lowe há três anos. Diante de todos, os dois fingem ser só bons colegas que discutem muito.",
        "A Peça de Inverno acontece durante o clímax, em dezembro. A Peça de Inverno (Hamlet, 14/12) é o epílogo. Se Elias sobreviver às cavernas, aparece no papel do Fantasma, que Renard deu a ele."]},
      {t:"Aula: Molière e o Corpo em Cena", body:[
        "Francês e Teatro, 1º ano. Quinta-feira, 16h às 18h. Palco do Anfiteatro Hume.",
        "Material: cópias de Le Bourgeois gentilhomme (Molière, 1670), uma lista de papéis do Hamlet para a Peça de Inverno, um piano velho no canto do palco e uma arara de figurinos."]},
      {t:"Objetivos da aula", ol:true, body:[
        "Fazer o aquecimento inteiro sem ficar de fora, incluindo andar como um animal no palco.",
        "Acertar as traduções da Parte 2.",
        "Passar no teste de elenco da Parte 3."]},
      {t:"Parte 1: aquecimento (20 min)", body:[
        "Renard recebe a turma de pé no palco, descalço, com um lenço laranja no pescoço. Todos tiram os sapatos. “Bonjour, mes enfants! Sapatos fora. O ator pensa com os pés. Quem tem chulé, que tenha coragem.”",
        "Respiração: deitados no chão do palco, uma mão na barriga. Inspirar em quatro tempos, segurar em quatro, soltar em oito, com um “ssss”.",
        "Voz: de pé, em círculo, cada um diz o próprio nome cada vez mais alto, até a última fileira do anfiteatro ouvir. “Mais, mais! Você está sussurrando, não está morrendo!”",
        "Trava-língua francês, em coro, cada vez mais rápido: Les chaussettes de l'archiduchesse sont-elles sèches, archisèches? (As meias da arquiduquesa estão secas, arquissecas?)",
        "Corpo: cada aluno atravessa o palco andando como um animal que ele escolher, sem falar. A turma adivinha. Renard sempre é um gato."]},
      {t:"Parte 2: Molière e a prosa (40 min)", body:[
        "Molière: Jean-Baptiste Poquelin, o maior cômico da França, ator, diretor, autor. Morreu em 1673, praticamente em cena, tossindo sangue enquanto fazia o papel de um homem que se fingia de doente. “Que fim para um ator, hein? Magnífico!”",
        "Hoje: Le Bourgeois gentilhomme, de 1670. Monsieur Jourdain é um burguês rico que quer, desesperadamente, parecer nobre. Contrata professores de tudo: dança, música, esgrima, filosofia. E o professor de filosofia lhe explica que tudo o que não é verso é prosa.",
        "Fala real (ato II, cena 4): “Par ma foi! il y a plus de quarante ans que je dis de la prose sans que j'en susse rien.” (Palavra de honra! Faz mais de quarenta anos que eu falo em prosa sem saber.)",
        "Ponto de gramática no quadro: Tu é íntimo: família, amigos, crianças (Tu viens?). Vous é formal ou plural: desconhecidos, superiores, mais de uma pessoa (Vous venez, Monsieur?). Passé simple é o tempo literário, só na escrita, como em susse, de savoir (Il mourut en 1673).",
        "“Na peça, Jourdain trata o professor de vous e a criada de tu. Quem a gente trata de tu diz muito sobre quem a gente pensa que é. Vale para a França e vale para este castelo.”",
        "Exercício em dupla: traduzir para o francês três frases do dia a dia do castelo, escolhendo entre tu e vous. 1. “Senhor Reitor, posso entrar?” (Monsieur le Recteur, puis-je entrer? vous). 2. “Você vem para o jantar?”, dito a um colega de quarto (Tu viens dîner? tu). 3. “Onde vocês estavam ontem à noite?”, dito pelo Hunt a um grupo de alunos (Où étiez-vous hier soir? vous, plural).",
        "Teste: Aptidão (Línguas) ou Mente, DT 7, para acertar as três traduções."]},
      {t:"Parte 3: teste de elenco do Hamlet (50 min)", body:[
        "“E agora, mes amours, o que interessa. Em dezembro, a Casa vai assistir ao Hamlet. E eu preciso de um elenco.” Em dois minutos: o príncipe da Dinamarca vê o fantasma do pai, que conta que foi assassinado pelo próprio irmão, o tio de Hamlet, agora rei e casado com a mãe dele. Hamlet finge loucura para descobrir a verdade, e quase todo mundo morre no fim.",
        "O teste: cada aluno lê em voz alta, em inglês, uma fala curta do Ato I, cena 5 (domínio público). Fala do Fantasma: “I am thy father's spirit, / Doom'd for a certain term to walk the night.” (Sou o espírito do teu pai, condenado por um tempo a vagar pela noite.) Fala de Hamlet: “O, all you host of heaven! O earth! What else?” (Ó, exércitos do céu! Ó, terra! E o que mais?)",
        "Teste: Aptidão (Artes) ou Persuasão, DT 7. Sucesso: Renard aplaude, anota o nome e diz o papel provisório. Falha: “No teatro, não existe erro. Existe emoção que ainda não encontrou o caminho. De novo, com o corpo inteiro.”",
        "O momento da cena: no fim do teste, a porta do fundo do anfiteatro se abre. É Elias, que “estava passando”. Renard o chama, encantado: “Monsieur Vane! O senhor faria um fantasma perfeito, tão pálido, tão melancólico. Leia para nós!” Elias sobe ao palco e recita a fala do Fantasma sem olhar o papel, com uma voz que esfria o anfiteatro. Ninguém aplaude por um segundo inteiro. Renard, emocionado, dá o papel do Fantasma a ele ali mesmo."]},
      {t:"Parte 4: fechamento (10 min)", body:[
        "“Para quinta que vem: decorem a sua fala do Hamlet, e escrevam em francês três frases sobre um personagem que vocês admiram, usando tu ou vous corretamente. E tragam uma meia velha. Não perguntem por quê.” (É para o exercício de marionete da próxima aula.)"]},
      {t:"Bônus da aula", body:[
        "Os 3 objetivos: Presença de Palco, +2 em testes de Persuasão ou Enganação quando o personagem estiver fingindo, encenando ou falando em público, até o fim da próxima sessão. Ganha um papel na Peça de Inverno e a pista abaixo.",
        "2 objetivos: +1 em Persuasão na próxima cena social. Ganha um papel pequeno na peça.",
        "1 ou nenhum: nada, e Renard o escala como “a árvore do segundo ato”."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "Nos bastidores, entre os figurinos, Renard fecha a cortina e fala baixo: “Você viu como o Vane leu o Fantasma? Sem papel. Eu nunca dei aquela fala a ele. E ele disse ‘doom'd’, com a pronúncia de um ator do século XVII, a que eu estudei em Bruxelas. Ninguém fala assim. Eu dei o papel a ele porque fiquei encantado. Agora que ele saiu, estou com medo. Adrian me disse para tomar cuidado com ele. Eu achei que era ciúme. Não conte ao Adrian que eu disse isso.”",
        "O jogador fica sabendo que Elias conhece o teatro do século XVII, que Lowe já desconfia dele, e ganha uma pista discreta sobre Lowe e Renard (“Adrian”, “ciúme”), para quem estiver atento."]},
      {t:"Para o mestre", seg:true, body:[
        "Elias como o Fantasma do Hamlet prepara a Cena 22 do cronograma: se Elias sobreviver às cavernas, ele aparece no palco na noite de 14/12, no papel que já era dele.",
        "O exercício de tu e vous parece gramática, mas é sobre poder: Hunt usa vous com os alunos, e Elias usa tu desde o primeiro dia. Um jogador atento pode notar isso.",
        "A meia velha da lição de casa é para fantoches. Na aula seguinte, Renard faz cada um contar um segredo por meio da marionete, “porque não é você que está falando, é a meia”. É uma boa cena para um jogador soltar algo que nunca diria."]}
    ]},

    { id:"morag", g:1, name:"Dra. Morag Lindsay", role:"Psicologia (27 anos)", blocks:[
      {t:"Resumo", body:[
        "Recém-doutora em Edimburgo, chegou em janeiro de 1996 para criar o curso de Psicologia, contra a vontade da velha guarda. É a professora mais jovem da Casa.",
        "Brilhante e curiosa, mas encolhe perto dos professores mais velhos. Pesquisa sono, sonhos e memória, e usa os alunos como voluntários."]},
      {t:"Aparência", body:["Baixa, rosto jovem e sardento, cabelo castanho cacheado curto preso com presilha, óculos de aro de tartaruga e blazer de veludo cotelê mostarda grande demais. Coturnos cor de vinho, prancheta e gravador de fita."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Lésbica, vive um relacionamento escondido com Kirsty Fraser, dona do sebo Fraser's Books em Stonehaven. Hunt desconfia e guarda uma cópia de uma carta no arquivo disciplinar.",
        "Elias descobre o segredo com Dedução e a chantageia: quer que ela encerre o estudo sobre memória e entregue a fita de Clara. Morag pode devolver a memória de Clara no Ato 5."]},
      {t:"Personalidade", body:[
        "Fala rápido quando se empolga e baixo quando está nervosa. Na frente da turma é confiante; no Senior Common Room, entre professores de sessenta anos, encolhe. Trata os alunos como colegas de pesquisa e lembra o nome de todos.",
        "“Você dormiu bem? Não? Ótimo! Quer dizer… ótimo para a pesquisa. Assine aqui.”",
        "“A memória não é um arquivo. É uma história que a gente conta de novo toda vez.”"]},
      {t:"Sala e rotina", body:[
        "Laboratório do Sono, numa antiga enfermaria vitoriana. Camas de ferro, um eletroencefalógrafo barulhento e cortinas pretas. Os alunos sentam nas camas.",
        "Abre com um experimento, sem explicar nada; depois explica o que aconteceu e mostra a teoria. Quem estuda, convida para ser voluntário. Quem faz bagunça, pergunta o que a pessoa sonhou ontem, na frente de todos, e a bagunça para. Quem chega atrasado, pede que descreva com detalhes o caminho que fez até a sala, e depois mostra quantos detalhes ela inventou."]},
      {t:"Aula: A Memória Mente", body:[
        "Psicologia, 1º ano. Sexta-feira, 10h às 12h. Laboratório do Sono, 2º andar, ala leste. Os estudos citados são reais e eram novidade em 1996, alguns de 1995."]},
      {t:"Parte 1: o experimento (15 min)", body:[
        "Morag entra com o gravador de fita na mão, nervosa, e começa sem se apresentar: “Bom dia! Desculpa, eu não vou explicar nada ainda, senão estraga. Fechem os cadernos. Ouçam esta lista de palavras e tentem lembrar o máximo que conseguirem. Não anotem.”",
        "Ela lê devagar, uma palavra a cada dois segundos (lista do experimento real de Roediger e McDermott, 1995): cama, descanso, acordado, cansado, sonho, despertar, soneca, cobertor, cochilo, ronco, travesseiro, paz, bocejo, sonolento.",
        "Ela espera um minuto e pede: “Agora escrevam todas as palavras de que lembram.” A armadilha: a palavra “sono” nunca foi dita. A maioria das pessoas jura que ouviu. Teste: Mente ou Intuição, DT 8. Falha: o jogador escreve “sono” e tem certeza de que ouviu. Sucesso: o jogador percebe que “sono” não estava na lista.",
        "Morag pergunta: “Quem escreveu ‘sono’?” Quase todos levantam a mão. Ela sorri: “Eu não disse ‘sono’. Nenhuma vez. Vocês acabaram de lembrar de uma coisa que não aconteceu.”"]},
      {t:"Parte 2: aula expositiva (40 min)", body:[
        "“A memória não é um gravador. Eu tenho um gravador aqui: ele guarda tudo igual, para sempre. A memória de vocês não faz isso. Ela reconstrói. Toda vez que vocês lembram de algo, contam a história de novo, e a cada vez a história muda um pouco.”",
        "Ebbinghaus, 1885: a curva do esquecimento. Esquecemos mais da metade de algo novo em menos de um dia, se não revisarmos.",
        "Loftus e Palmer, 1974: pessoas viram o filme de uma batida de carro. Quem ouviu “a que velocidade os carros se esmagaram?” disse velocidades maiores, e uma semana depois “lembrava” de vidro quebrado que não existia no filme.",
        "Loftus, perdido no shopping, 1995: um quarto dos participantes passou a “lembrar” de ter se perdido num shopping quando criança, uma história falsa contada por um parente.",
        "Roediger e McDermott, 1995: o experimento que vocês acabaram de fazer.",
        "“Uma pergunta bem-feita, ou uma pessoa em quem a gente confia, consegue colocar uma lembrança dentro de nós. E a gente vai jurar que é nossa.”",
        "Sono e sonhos: “Em 1953, Aserinsky e Kleitman, em Chicago, descobriram que, em certos momentos da noite, os olhos de quem dorme se mexem muito rápido. Chamaram isso de sono REM, de rapid eye movement. É quando sonhamos. A noite tem ciclos de uns noventa minutos, e cada ciclo termina num período de REM. Esse aparelho barulhento aqui mostra as ondas do cérebro durante a noite.” Ela desenha no quadro um hipnograma simples: vigília, sono leve, sono profundo, REM, repetindo de 4 a 5 vezes na noite.",
        "“E aqui está o que eu estudo: o sono REM é quando a memória se organiza. Se você não dorme, você não guarda. E se alguém interfere no seu sono, pode interferir no que você lembra.”"]},
      {t:"Parte 3: prática em dupla (35 min)", body:[
        "O diário de sono. Cada dupla entrevista o colega com o questionário da pesquisa: 1. A que horas você dormiu nas últimas três noites? 2. Você acordou durante a noite? Lembra por quê? 3. Lembra de algum sonho? Descreva. 4. Houve alguma noite da qual você não lembra de nada, nem de ter ido para a cama? 5. Você se sente mais cansado do que deveria?",
        "Teste: Intuição, DT 7, para perceber se o colega está escondendo algo na resposta.",
        "O momento da cena: se algum jogador estiver dormindo com o livro do Elias no quarto, ele responde “sim” à pergunta 4 sem saber por quê, ou descreve um sonho com velas e frio. Morag para de anotar e olha para ele um segundo longo demais."]},
      {t:"Parte 4: fechamento (10 min)", body:[
        "“Para sexta que vem: preencham o diário de sono por sete noites seguidas. Hora de deitar, hora de acordar, sonhos. E quem quiser ser voluntário da pesquisa, a sério, com o eletroencefalógrafo, deixa o nome comigo. Eu pago em chá e biscoito. É o orçamento que a velha guarda me deu.”"]},
      {t:"Objetivos e bônus", body:[
        "Objetivos: 1. Não cair na falsa memória, ou, se cair, admitir em voz alta. 2. Explicar com as próprias palavras um dos estudos do quadro, quando Morag perguntar. 3. Fazer a entrevista em dupla com seriedade.",
        "Os 3 objetivos: Mente Desconfiada, +2 em testes para resistir ao Encanto, a ilusões ou a manipulação da memória até o fim da próxima sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em Intuição até o fim da sessão.",
        "1 ou nenhum: nada, e Morag pede o diário de sono de quatorze noites."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "Morag pede que o aluno fique para ajudar a guardar os eletrodos e fala rápido, mexendo nos fios: “Você entendeu a aula, então você vai entender isto. Eu tenho treze alunos que não lembram onde estavam em noites inteiras. Treze. Todos de um clubinho de poesia. Uma delas, a Clara Bennett, eu hipnotizei em agosto. Ela descreveu um rapaz que beija o pescoço dela e ‘o mundo fica em silêncio’. Eu achei que era uma fantasia romântica. Agora a Clara sumiu. Eu sou cientista, eu não… Olha, se você souber de alguém do clube que queira falar comigo, manda vir. Por favor.”",
        "O jogador fica sabendo das treze lacunas de memória da Vigília e da fita da Clara, e ganha a Morag como aliada."]},
      {t:"Para o mestre", seg:true, body:[
        "O experimento da lista é a melhor demonstração do que o Elias faz: ele não apaga memórias, ele sugere, e as pessoas passam a lembrar do que ele quer. Se um jogador fizer essa ligação em voz alta, dê +1 no placar contra o Encanto.",
        "O diário de sono é a forma mais simples de os jogadores descobrirem o Ritual do Livro: quem dorme com o livro tem noites em branco e sonhos com velas.",
        "Se a chantagem do Elias já tiver acontecido (Cena 15), Morag dá a aula pálida e cancela a Parte 3 no meio, sem explicar. Ela olha para o gravador o tempo todo."]}
    ]},
    { id:"hay", g:1, name:"Dr. Gideon Hay", role:"Filosofia; chefe do Departamento (63 anos)", blocks:[
      {t:"Resumo", body:[
        "Filósofo brilhante e distraído, especialista em Hume. Tutor de Elias Vane, de quem tem orgulho enorme: “o aluno mais extraordinário em quarenta anos”.",
        "Cachimbo sempre apagado na mão."]},
      {t:"Aparência", body:["Pequeno e magro, cabelo branco revolto, sobrancelhas enormes e olhos muito escuros. Cardigã marrom com furos, gravata torta e beca puída."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Os ensaios de Elias citam manuscritos do século XVII que não existem em nenhuma biblioteca, com detalhes “de quem estava lá”. A ficha de transferência de 1994 tem um carimbo de uma faculdade de Oxford fechada em 1902.",
        "Hay é cego para Elias por admiração. Convencê-lo é difícil e doloroso; se acontecer, ele pode dar um depoimento ao Reitor.",
        "Ensaio do Elias: confissão disfarçada, sobre um homem que vive trezentos anos e tem o direito, e talvez o dever, de continuar colecionando."]},
      {t:"Personalidade", body:[
        "Distraído, gentil, apaixonado por perguntas. Responde a uma pergunta com outra pergunta. Esquece o cachimbo apagado na boca e fala com ele entre os dentes. Admira o Elias como um pai admira um filho brilhante.",
        "“Hume nos ensina que o hábito é o grande guia da vida. Mas o que acontece quando o hábito dura séculos?”",
        "“Não me dê a resposta. Me dê uma pergunta melhor.”"]},
      {t:"Sala e rotina", body:[
        "O gabinete dele, na torre leste, cheio de livros até o teto. Os alunos sentam no chão, nas poltronas e em pilhas de livros. A lareira fica sempre acesa.",
        "É um seminário, não uma aula. Um aluno lê um ensaio em voz alta, e a turma tenta destruí-lo com perguntas. Quem estuda, convida para ler o próximo ensaio. Quem faz bagunça, pergunta, muito sério, se a pessoa tem certeza de que existe; a discussão que vem depois costuma durar meia hora. Quem chega atrasado nem percebe."]},
      {t:"Aula: Seminário, Quem é você daqui a trezentos anos?", body:[
        "Filosofia, 1º ano. Terça-feira, 15h às 17h. Gabinete do Dr. Hay, 2º andar, torre leste. Os filósofos e os argumentos são reais."]},
      {t:"Objetivos da aula", ol:true, body:[
        "Responder à pergunta de abertura com um argumento, não só com “sim” ou “não”.",
        "Explicar com as próprias palavras um dos três filósofos, quando Hay perguntar.",
        "Apontar uma falha no ensaio do Elias (teste da Parte 3)."]},
      {t:"Parte 1: a pergunta (10 min)", body:[
        "Hay está de pé diante da lareira, de costas para a turma, com o cachimbo apagado na mão: “Uma pergunta antes de começar. Vocês são a mesma pessoa que eram aos cinco anos de idade?”",
        "Quando alguém responde “sim”, ele se vira: “Ótimo. Por quê? O seu corpo trocou quase todas as células. Você não pensa como pensava. Não gosta do que gostava. Não lembra de quase nada. O que, exatamente, continuou igual?”"]},
      {t:"Parte 2: os três filósofos (35 min)", body:[
        "1. John Locke (inglês, 1694): a memória faz a pessoa. “Para Locke, você é a mesma pessoa enquanto lembrar de ser. Se você lembra de ter feito algo, você é quem fez. Simples, elegante. E, como tudo que é simples, errado.”",
        "2. Thomas Reid (escocês, 1785): o oficial valente. “Um escocês, naturalmente, foi quem encontrou o erro. Reid imaginou um menino que é açoitado por roubar maçãs. Anos depois, ele é um jovem oficial que se lembra do açoite. Ainda mais tarde, é um velho general que se lembra de ter sido oficial, mas já não lembra do açoite. Pela regra de Locke, o general é o oficial, e o oficial é o menino, mas o general não é o menino. É absurdo. A memória não pode ser tudo.”",
        "3. David Hume (escocês, 1739): não existe um eu. “E então vem Hume, o maior de todos, e diz algo terrível. Ele olhou para dentro de si mesmo, procurando o ‘eu’, e não encontrou nada além de sensações, uma depois da outra: frio, calor, amor, ódio, dor. Ele escreveu que o ser humano é nothing but a bundle or collection of different perceptions. Nada além de um feixe de percepções. Não há ninguém lá dentro. Só a sequência.”",
        "Hay bate o cachimbo na palma da mão: “Se Hume estiver certo, não existe um ‘você’ que dure. Existe uma história que vai sendo contada. E a pergunta passa a ser: quem está contando?”"]},
      {t:"Parte 3: o seminário (60 min)", body:[
        "“Hoje quem lê é o meu melhor aluno. Monsieur… Mister Vane. Por favor.” Elias, que estava sentado no parapeito da janela, de costas para a luz, abre um caderno de couro e lê o ensaio dele: “‘Sobre um homem que vivesse trezentos anos.’ Imaginemos um homem que não morre. Ele vê os amigos envelhecerem, as cidades mudarem, os reis caírem. Ao fim do primeiro século, ainda é quem era? Lembra-se de tudo, como Locke exigiria. Mas, como Hume previu, o feixe de percepções que ele chama de ‘eu’ já foi trocado tantas vezes que nada resta do original. Concluo que esse homem não é uma pessoa: é uma coleção. E, se é uma coleção, tem o direito, e talvez o dever, de continuar colecionando.”",
        "Hay aplaude devagar, encantado. A tarefa da turma: encontrar a falha no argumento do Elias. Teste: Mente ou Aptidão (Filosofia), DT 8.",
        "Sucesso: o jogador aponta a falha. Por exemplo: “Se ele é só uma coleção, então ninguém é responsável por nada do que ele fez”; “Colecionar o quê?”; ou “Então, para ele, as outras pessoas também são só coleções. Isso justifica qualquer coisa.”",
        "Se o jogador acertar a falha moral (a de que o argumento justifica qualquer coisa), Elias sorri devagar, fecha o caderno e diz só: “Muito bem. Você seria um ótimo item de coleção.” Hay ri, achando que é uma piada."]},
      {t:"Parte 4: fechamento (10 min)", body:[
        "“Para terça que vem: duas páginas respondendo ao Mister Vane. Defendam o que torna vocês a mesma pessoa. Se não conseguirem, defendam que não são. Mas defendam.”"]},
      {t:"Objetivos e bônus", body:[
        "Os 3 objetivos: Pensamento Claro, +2 em testes de Mente para resistir a argumentos, à sedução intelectual ou ao Encanto do Elias, até o fim da próxima sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Mente até o fim da sessão.",
        "1 ou nenhum: nada, e Hay pede o ensaio “em quatro páginas, que duas não chegam para pensar”."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "Depois do seminário, Hay chama o aluno para ver “uma coisa curiosa”: “Você argumentou bem contra ele. Ninguém faz isso. Olhe aqui, este é outro ensaio dele, do ano passado, sobre a caça às bruxas de 1662. Ele escreve em primeira pessoa, por licença literária, veja só: ‘O tribunal cheirava a sebo e medo. A criada tremia ao meu lado.’ Ele cita uma carta do reitor da época que eu nunca encontrei em biblioteca nenhuma. Eu perguntei de onde tinha tirado, e ele disse ‘dos arquivos da família’. Um prodígio. Um verdadeiro prodígio.”",
        "O jogador lê a frase sobre a criada (Margaret Lyall, 1662). Quem conhece a história percebe que o Elias escreveu sobre um crime que ele mesmo cometeu."]},
      {t:"Para o mestre", seg:true, body:[
        "O ensaio do Elias é uma confissão disfarçada. Quando os jogadores descobrirem quem ele é, esse texto se torna assustador.",
        "Hay é a pessoa mais perigosa para os jogadores sem ter culpa nenhuma: ele mostra ao Elias tudo o que os alunos escrevem nos ensaios. Se um jogador escrever o ensaio da lição de casa denunciando o Elias, o Elias lê.",
        "Convencer Hay exige três provas juntas: o carimbo de Oxford de 1902, o ensaio de 1662 e o Livro de Matrículas com a mesma letra de 1662, 1887 e 1994. Quando cair a ficha, ele senta, apaga a lareira e diz: “Eu passei quarenta anos ensinando a duvidar. E não duvidei dele.”"]}
    ]},
    { id:"munro", g:1, name:"Prof.ª Ailsa Munro", role:"Música (47 anos)", blocks:[
      {t:"Resumo", body:[
        "Organista da capela, regente do coral e professora de teoria e canto. Sensível e ligeiramente mística, ouve “vozes na música”.",
        "Mora no castelo há vinte anos e é a única que admite em voz alta que o órgão toca sozinho às três."]},
      {t:"Aparência", body:["Alta e magra, cabelo grisalho prateado muito comprido, mãos longas de pianista, xale tartã azul e muitos anéis de prata. Fala baixo e cantarola."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Mulher trans, escondida: fez a transição em Londres antes de chegar a Dunraven, em 1976. Ninguém no castelo sabe. Sua certidão antiga está no cofre do Reitor Ross, e Hunt pode achá-la nos arquivos da Secretaria.",
        "Reconhece a técnica de “E. Lyall” nas partituras. As três notas que o órgão toca às três são do salmo de Margaret Lyall, e cantá-lo nas cavernas pode enfraquecer Carne.",
        "Personalidade: fala baixo, quase cantando. Escuta mais do que fala. Trata cada voz como um instrumento que precisa ser afinado com paciência. Nunca levanta a voz: quando quer silêncio, toca uma nota no diapasão e espera.",
        "“A música lembra de tudo. As pessoas esquecem, as pedras esquecem. A música, não.” / “Não cante bonito. Cante verdadeiro. Bonito vem depois.”"]},
      {t:"Sala e rotina", body:[
        "A galeria superior da Capela de São Columba, ao lado do órgão de 1790. Os alunos ficam de pé em semicírculo, e a acústica de pedra faz cada voz voltar duas vezes.",
        "Começa no escuro, com cinco minutos de silêncio para ouvir a capela. Depois vem o aquecimento vocal, e por fim o canto. Quem estuda, convida para fazer o papel do precentor (quem puxa o canto). Quem faz bagunça, pede que cante sozinho uma nota longa, segurando até perder o fôlego; a bagunça vira respeito. Quem chega atrasado não diz nada: entrega um saltério aberto na página certa."]},
      {t:"Aula: Os Salmos que Atravessam o Tempo", body:[
        "Música, 1º ano. Quarta-feira, 18h às 19h30. Galeria da Capela de São Columba. A tradição, o saltério e o salmo são reais."]},
      {t:"Parte 1: o silêncio (10 min)", body:[
        "Ailsa espera os alunos com as luzes apagadas e só uma vela acesa no console do órgão: “Boa noite. Sentem-se no chão, por favor. Cinco minutos de silêncio. Não para rezar: para ouvir. Uma capela de quatrocentos anos tem muito a dizer, se a gente deixar.”",
        "Durante o silêncio, teste de Percepção, DT 8: o jogador ouve, muito baixo, uma respiração que não é de ninguém da turma, vinda dos tubos do órgão. Ailsa percebe o olhar dele e sorri devagar, sem explicar."]},
      {t:"Parte 2: aula expositiva (25 min)", body:[
        "“Depois da Reforma, em 1560, a Igreja da Escócia proibiu quase toda a música na missa. Nada de hinos inventados por homens. Só a Palavra de Deus, cantada. Então os escoceses pegaram os Salmos da Bíblia e os reescreveram em versos com rima e métrica, para que o povo pudesse cantá-los. O saltério que ficou foi o de 1650. É este aqui.”",
        "Quadro: Salmo métrico, um salmo da Bíblia reescrito em versos regulares, com rima, para ser cantado. Métrica comum (8.6.8.6), versos de 8 e 6 sílabas alternados, que serve para qualquer melodia da mesma métrica. Melodia (tune), que tinha nomes de cidades: Dundee, Old Hundredth, Martyrs, French. Precentor, quem puxa o canto: canta cada linha sozinho, e a congregação repete.",
        "“E nas igrejas das Highlands, nas ilhas, cantando em gaélico, nasceu uma coisa extraordinária. O precentor canta a linha, e a congregação responde, mas cada um canta no seu tempo, com os seus enfeites, devagar. Não fica um coro. Fica um mar de vozes, cada uma chegando quando consegue. Ainda se canta assim hoje, em Lewis, nas Hébridas. É a coisa mais antiga e mais estranha que vocês vão ouvir na vida.”"]},
      {t:"Parte 3: o canto (40 min)", body:[
        "Salmo 121 (Scottish Psalter, 1650): I to the hills will lift mine eyes, / from whence doth come mine aid. / My safety cometh from the Lord, / who heav'n and earth hath made.",
        "Thy foot he'll not let slide, nor will / he slumber that thee keeps. / Behold, he that keeps Israel, / he slumbers not, nor sleeps.",
        "The Lord thee keeps, the Lord thy shade / on thy right hand doth stay: / The moon by night thee shall not smite, / nor yet the sun by day.",
        "The Lord shall keep thy soul; he shall / preserve thee from all ill. / Henceforth thy going out and in / God keep for ever will.",
        "Tradução para a mesa: Aos montes erguerei meus olhos: de onde virá meu socorro? Meu socorro vem do Senhor, que fez o céu e a terra. Ele não deixará teu pé escorregar; não dorme quem te guarda. Aquele que guarda Israel não cochila nem dorme. O Senhor te guarda; o Senhor é tua sombra à tua mão direita. A lua não te ferirá de noite, nem o sol de dia. O Senhor guardará tua alma e te livrará de todo mal. Tua saída e tua entrada Deus guardará para sempre.",
        "Como a turma canta: 1. Ailsa toca a melodia uma vez no órgão, devagar. 2. Ela canta a primeira linha sozinha, como precentor. 3. A turma repete a linha, devagar, cada um no seu tempo, do jeito das Highlands. 4. No terceiro verso, ela convida um aluno para ser o precentor.",
        "Teste: Aptidão (Música) ou Emoção, DT 7, para cantar afinado com o grupo.",
        "O momento da cena: na estrofe “The moon by night thee shall not smite”, todos os que passaram no teste ouvem o órgão responder sozinho: as três primeiras notas da melodia, baixinho, sem ninguém nas teclas. Ailsa continua cantando de olhos fechados, como se nada tivesse acontecido, e só para no fim do salmo."]},
      {t:"Parte 4: fechamento (15 min)", body:[
        "“Para quarta que vem: decorem a primeira estrofe. E quem quiser entrar no coral para o culto de domingo é bem-vindo. Pagamos em chá e em paciência.”"]},
      {t:"Objetivos e bônus", body:[
        "Objetivos: 1. Ficar os cinco minutos em silêncio sem rir nem conversar. 2. Explicar o que é um precentor quando Ailsa perguntar. 3. Cantar afinado com o grupo (teste da Parte 3).",
        "Os 3 objetivos: Voz Guardada. O jogador aprende o Salmo 121 de cor. Até o fim da campanha, cantá-lo uma vez por sessão dá +2 em um teste contra medo, efeitos de Sangue ou o Encanto. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Emoção até o fim da sessão.",
        "1 ou nenhum: nada, e Ailsa pede que o aluno venha à capela às 7h, por uma semana, para aprender a ouvir."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "A turma sai, e Ailsa pede que o aluno espere. Ela fala baixo, sentada no órgão, mexendo nos anéis: “Você ouviu, não ouviu? O órgão. Eu ouço há vinte anos. Sempre às três da manhã, sempre as mesmas três notas: o começo deste salmo. Eu procurei durante anos de onde vinha. Achei num livrinho de salmos de 1662, nos arquivos, com o nome de uma criada: Margaret Lyall. Alguém quer muito que ela seja lembrada. E tem mais uma coisa. Um aluno tocou o piano desta capela no mês passado. Tocou Bach como quem conheceu Bach. Com uma técnica que só vi em partituras velhas, assinadas por um certo ‘E. Lyall, tutor’. Lyall de novo. Eu não acredito em coincidências, querido. Acredito em música.”",
        "O jogador fica sabendo de Margaret Lyall, do salmo, do nome E. Lyall e de que o Elias toca como esse tutor do século XIX."]},
      {t:"Para o mestre", seg:true, body:[
        "O Salmo 121 é uma arma sem parecer uma: fala de proteção contra quem não dorme, contra a lua e contra o sol. No altar das cavernas, cantado pelo grupo, ele é o bônus do ritual para destruir o pacto.",
        "Os versos “the moon by night thee shall not smite” podem ser o momento em que o órgão responde em qualquer cena que você quiser, não só na aula.",
        "Se o Elias passar pela capela durante a aula, ele não entra. Fica parado na porta enquanto o salmo é cantado, e vai embora antes do fim."]}
    ]},
    { id:"forbes", g:1, name:"Prof. Niall Forbes", role:"Artes Visuais e Arquitetura (50 anos)", blocks:[
      {t:"Resumo", body:[
