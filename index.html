        "Chefe do Departamento de Artes e restaurador oficial do acervo do castelo. Bem-humorado, fofoqueiro e apaixonado pelo gótico. Orientador de Lucy Bell."]},
      {t:"Aparência", body:["Barrigudo, careca com uma coroa de cabelo grisalho, barba cheia e óculos de meia-lua. Avental de pintor manchado, gravata-borboleta e tinta nos dedos."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Sob luz ultravioleta, descobriu que o rosto do retrato de Thomas Carne (1662) foi repintado em 1890 e em 1960, sempre para parecer mais velho. A camada original mostra um rapaz de uns 20 anos.",
        "Elias passa no ateliê com frequência demais, “admirando o trabalho”."]},
      {t:"Personalidade", body:[
        "Fala alto, ri das próprias piadas, conta fofoca sobre tudo e todos com carinho e sem maldade. Trata os quadros como pessoas e as pessoas como quadros.",
        "“Todo quadro mente, meus queridos. O segredo é descobrir para quem.”",
        "“Um restaurador não pinta. Um restaurador escuta o que o pintor quis dizer.”"]},
      {t:"Sala e rotina", body:[
        "O Ateliê Forbes, no sótão da ala sul, com claraboias, cavaletes, telas antigas em restauro e cheiro de terebintina.",
        "Começa com um passeio pelo castelo para desenhar a arquitetura e volta ao ateliê para a parte técnica. Quem estuda deixa segurar a lâmpada UV ou o pincel de restauro. Quem faz bagunça pede um desenho de uma gárgula “com a sua cara”, e pendura no ateliê. Quem chega atrasado pergunta qual fofoca a pessoa ouviu no caminho."]},
      {t:"Aula: As Pedras e as Camadas", body:[
        "Artes Visuais e Arquitetura, 1º ano. Sexta-feira, 14h às 16h30. Claustro, capela e Ateliê Forbes. A arquitetura gótica e as técnicas de restauração são reais."]},
      {t:"Parte 1: o passeio gótico (45 min)", body:[
        "“O castelo é de 1342. Gótico escocês, que é como o gótico francês, só que com mais frio e menos dinheiro. Olhem para cima. Sempre olhem para cima. As pessoas passam a vida olhando para os próprios sapatos.”",
        "Elementos do gótico no castelo: arco ogival, arco pontudo que leva o peso para baixo (arcadas do claustro, janelas da capela); abóbada de nervuras, teto em arcos que se cruzam como costelas (teto da capela); rosácea, janela redonda com vitral em forma de flor (capela, sobre o altar); gárgula, escultura que escoa a água da chuva pela boca (beirais do Great Hall); contraforte, pilar externo que segura a parede (lado do mar da Ala Leste).",
        "“As gárgulas não são decoração, são calhas. Os monstros servem para alguma coisa: põem a água para fora. Guardem isso, é uma boa lição de vida.”",
        "Tarefa: cada aluno desenha um elemento gótico do castelo."]},
      {t:"Parte 2: técnicas de restauração (30 min)", body:[
        "“Uma pintura a óleo não é uma camada: é um bolo. Embaixo, a preparação da tela. Depois, o desenho. Depois, as camadas de tinta. Por cima de tudo, o verniz. E por cima do verniz, às vezes, um restaurador desastrado do século passado.”",
        "Luz ultravioleta: o verniz velho brilha verde-leitoso sob a UV, e os retoques recentes, feitos por cima do verniz, aparecem como manchas escuras. É assim que se descobre onde alguém mexeu.",
        "Raio X: atravessa a tinta e mostra o que está embaixo, sobretudo o branco de chumbo. Às vezes aparece outro quadro inteiro por baixo.",
        "Pentimento: quando o pintor mudou de ideia, uma mão que estava em outro lugar, um rosto que olhava para o outro lado. Vem do italiano pentirsi, arrepender-se. O quadro guarda o arrependimento do pintor."]},
      {t:"Parte 3: o retrato de Thomas Carne (40 min)", body:[
        "Forbes puxa um pano de cima de um cavalete: “Minha paciente da semana. O reverendo Thomas Carne, reitor, acusado de bruxaria em 1662. Coitado, um homem tão sério. Apaguem a luz.” Ele liga a lâmpada UV. O verniz brilha verde, mas o rosto inteiro aparece escuro: foi retocado por cima do verniz. “As fotos de raio X que eu mandei fazer em Edimburgo mostram três rostos, um sobre o outro.”",
        "Ele espalha três fotografias de raio X sobre a mesa: a camada de 1960, com o rosto mais velho; a de 1890, um pouco mais jovem; e a original de 1662, que mostra um rapaz de uns vinte anos.",
        "Teste: Inspecionar ou Percepção, DT 8. Sucesso: o jogador percebe que as camadas foram pintadas para envelhecer o rosto, não para corrigir dano, e que o rapaz da camada original se parece demais com o Elias. Forbes acha graça: “Que tradição curiosa, não? Cada restaurador acrescentou umas rugas. Talvez achassem que um reitor precisa parecer velho. Eu vou tirar tudo e devolver o rapaz ao mundo!”",
        "O momento da cena: a porta do ateliê se abre. É o Elias, que estava passando. Ele olha a foto de raio X da camada original por um segundo longo, sem expressão, e diz baixo: “Era mais bonito antes.” Depois sorri para a turma e vai embora."]},
      {t:"Parte 4: fechamento (15 min)", body:[
        "“Para sexta que vem: terminem o desenho gótico, com sombra. E pensem nisto: se vocês tivessem que esconder algo dentro de um quadro, onde esconderiam? Os melhores segredos estão sempre embaixo de outra coisa.”"]},
      {t:"Objetivos e bônus", body:[
        "Objetivos: 1. Desenhar um elemento gótico do castelo e dizer o nome certo dele. 2. Explicar com as próprias palavras o que é pentimento ou como funciona a luz UV. 3. Perceber o que as camadas do retrato escondem (teste da Parte 3).",
        "Os 3 objetivos: Olhar Restaurador, +2 em testes de Inspecionar para perceber falsificações, retoques, assinaturas e documentos adulterados até o fim da próxima sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Inspecionar ou Percepção até o fim da sessão.",
        "1 ou nenhum: nada, e Forbes pede para o aluno limpar todos os pincéis do ateliê “com amor”."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "Quando a turma sai, Forbes chama o aluno, entusiasmado como quem conta uma fofoca: “Querido, uma coisa engraçada, só entre nós. Aquele rapaz, o Vane, vem aqui quase todo dia ver este quadro. No mês passado eu achei ele sozinho, no escuro, com a minha lâmpada UV ligada, olhando para o rosto. E a Lucy, minha orientanda, tentou desenhar ele na biblioteca e não conseguiu fazer o rosto. Disse que ‘não fica no papel’. Que coisa, não? E tem mais: eu ia mandar o retrato de volta para o Great Hall na semana que vem, e ele me pediu para não tirar as camadas de cima. Disse que ‘a história também faz parte do quadro’. Que rapaz sensível!”",
        "O jogador fica sabendo que o Elias vigia o retrato, que não quer que a camada original apareça, e que a Lucy não consegue desenhar o rosto dele."]},
      {t:"Para o mestre", seg:true, body:[
        "As fotos de raio X das três camadas são prova física de que o rosto do Elias é o de 1662. Se os jogadores as levarem ao Dr. Hay ou ao Reitor, junto com o Livro de Matrículas, é o que basta para convencer quem ainda duvida.",
        "Se o Elias perceber que alguém viu as fotos, elas somem do ateliê. Forbes vai achar que as perdeu e vai ficar inconsolável.",
        "Os retoques de 1890 e 1960 batem com os despertares do Carne (como Edward Lyall, em 1888, e logo depois do incêndio de 1957). Foi ele mesmo quem pediu aos restauradores da época que envelhecessem o reitor."]}
    ]},
    { id:"baird", g:1, name:"Dr. Robert Baird", role:"Matemática e Filosofia Natural; chefe do Departamento de Ciências (57 anos)", blocks:[
      {t:"Resumo", body:[
        "Matemático e astrônomo amador, tímido, metódico e melancólico. Quer reabrir o Observatório da Torre Norte há vinte anos.",
        "Era aluno em 1957 e dividia o quarto com David Shaw."]},
      {t:"Aparência", body:["Alto, careca, barba grisalha bem aparada, óculos grossos e suéter de tricô com padrão de losangos. Calculadora científica no bolso da camisa."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Gay, escondido a vida inteira. Estava apaixonado por David Shaw e nunca disse a ele. Guarda os cadernos de observação de David, que registram um rapaz que sobe ao Observatório sem aparecer no reflexo do telescópio.",
        "Seus cálculos mostram que 30/11/1996 é noite de lua minguante. Pode emprestar a chave sobressalente da Torre Norte.",
        "Ensinou a ficar em silêncio no escuro e a respeitar o tempo dos olhos. Tímido, fala para o quadro e não para a turma; só levanta os olhos quando fala de estrelas. Nunca se atrasa, nunca falta e nunca fala de si mesmo.",
        "“Números não mentem. Pessoas, sim. Arquivos, sempre.” / “O céu é a única coisa neste castelo que não mudou desde 1342.”"]},
      {t:"Sala e rotina", body:[
        "A primeira hora é na Sala de Cálculo, ao pé da Torre Norte. A segunda é no Gramado Sul, à noite, com telescópios portáteis e lanternas cobertas com papel celofane vermelho, para não cegar a vista.",
        "Rotina: cálculo no quadro, depois observação. Quem estuda deixa apontar o telescópio e escolher o alvo. Quem faz bagunça pede que conte em voz alta as estrelas das Plêiades a olho nu; a bagunça vira discussão de astronomia. Quem chega atrasado recebe a hora exata em que chegou, com segundos, e nada mais."]},
      {t:"Aula: O Relógio da Lua", body:[
        "Matemática e Filosofia Natural, 1º ano. Quinta-feira, 20h às 22h. Sala de Cálculo e Gramado Sul. A astronomia é real, e as datas de 1996 e 1991 também."]},
      {t:"Parte 1: o cálculo (50 min, Sala de Cálculo)", body:[
        "“Boa noite. A Lua leva cerca de 29,53 dias para voltar à mesma fase. Isso se chama mês sinódico. Se vocês souberem a data de uma lua nova, conseguem calcular a fase da Lua de qualquer dia, de qualquer ano, do passado ou do futuro. É o relógio mais antigo do mundo.”",
        "Fases, em dias depois da lua nova: 0, lua nova (invisível); cerca de 7,4, quarto crescente; cerca de 14,8, lua cheia; cerca de 22,1, quarto minguante; 29,5, lua nova outra vez. “Entre a cheia e o quarto minguante, a Lua é ‘minguante gibosa’: ainda quase cheia, mas diminuindo. Nasce tarde, depois das nove ou dez da noite, e fica no céu até de manhã.”",
        "O método: 1. Pegue uma lua nova conhecida. Ele usa a de 11 de novembro de 1996. 2. Conte os dias até a data que você quer. 3. Divida por 29,53 e fique com o resto. 4. Compare o resto com a tabela.",
        "O exercício da turma: calcular a fase da Lua no dia 30 de novembro. De 11 a 30 de novembro são 19 dias: depois da cheia (dia 25) e antes do quarto minguante. Resposta: minguante gibosa, poucos dias depois da cheia. Teste: Aptidão (Matemática) ou Mente, DT 8."]},
      {t:"Parte 2: a observação (60 min, Gramado Sul)", body:[
        "“Luz vermelha não estraga a vista do escuro. Desliguem tudo o que é branco. Esperem vinte minutos. Os olhos precisam de tempo para se acostumar com a noite, como tudo neste castelo.”",
        "O céu de novembro na Escócia: Cassiopeia, o W, bem alto sobre o castelo. As Plêiades, um pequeno aglomerado azulado; quem tem vista boa vê seis ou sete estrelas a olho nu. A Galáxia de Andrômeda, uma manchinha leitosa perto de Cassiopeia: “A luz que vocês estão vendo saiu de lá há mais de dois milhões de anos. Vocês estão olhando para o passado.” Órion nascendo a leste, sobre o mar, mais tarde da noite. O cometa Hale-Bopp, descoberto em 1995, já visível pelo telescópio, baixo no céu: “No ano que vem, ele vai estar tão brilhante que todo mundo vai ver sem telescópio. Vocês estão vendo antes de todo mundo.” (É real: foi o grande cometa da primavera de 1997.)",
        "Teste: Percepção, DT 7, para achar a Galáxia de Andrômeda no telescópio.",
        "O momento da cena: enquanto a turma observa, alguém vê uma luz acesa no alto da Torre Norte, no Observatório interditado. Uma lamparina amarela, que se apaga sozinha alguns segundos depois. Baird vê também. Fica imóvel, tira os óculos, limpa as lentes e diz só: “Reflexo. Vamos guardar os telescópios.”"]},
      {t:"Parte 3: fechamento (10 min)", body:[
        "“Para quinta que vem: calculem a fase da Lua no dia em que vocês nasceram. E no dia de hoje, daqui a cem anos. A Lua vai estar lá. Nós, não.”"]},
      {t:"Objetivos e bônus", body:[
        "Objetivos: 1. Acertar o cálculo da fase da Lua de 30/11 (teste da Parte 1). 2. Esperar os vinte minutos no escuro sem acender lanterna branca. 3. Achar a Galáxia de Andrômeda no telescópio (teste da Parte 2).",
        "Os 3 objetivos: Olhos da Noite, +2 em testes de Percepção no escuro e em testes para calcular horários (marés, amanhecer, rondas) até o fim da próxima sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Percepção até o fim da sessão.",
        "1 ou nenhum: nada, e o aluno carrega todos os telescópios de volta."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "A turma volta para dentro, e Baird fica para trás com o aluno, olhando a Torre Norte apagada. Fala devagar, como quem nunca disse aquilo em voz alta: “Eu dividi o quarto com um rapaz em 1957. David Shaw. Ele era o melhor de nós. Passava as noites lá em cima, no Observatório. Uma semana antes do incêndio, ele escreveu no caderno que um rapaz subia a escada sem fazer barulho, e que não aparecia no espelho do telescópio. Eu achei que era cansaço. Eu guardo os cadernos dele até hoje.”",
        "“E fiz uma conta, depois que aquele rapaz de Glasgow sumiu, em 1991. Véspera do Natal: lua minguante, poucos dias depois da cheia. Hoje vocês calcularam o dia 30. Mesma fase. Eu não acredito em coincidências. Eu acredito em números.”",
        "“A chave da torre não sumiu de todo. Eu tenho uma. Se um dia vocês precisarem subir lá… eu não posso. Não consigo. Mas vocês podem.”",
        "O jogador fica sabendo do rapaz sem reflexo em 1957, da coincidência da Lua entre 1991 e 1996, e de que Baird tem a chave sobressalente da Torre Norte."]},
      {t:"Para o mestre", seg:true, body:[
        "A conta da Lua dá aos jogadores um motivo matemático para desconfiar do dia 30/11 antes de acharem o caderno no bunker. Se eles já souberem a data, a aula confirma.",
        "A luz no Observatório é o elemento Sangue reagindo ao lugar onde a Membrana está fraca. Se os jogadores subirem com a chave de Baird, encontram as marcas de mão queimadas na parede e o lugar vazio onde ficava o astrolábio de David, que hoje está na caixa de troféus.",
        "Baird não fala de David como um amigo qualquer. Um teste de Intuição, DT 9, durante a pista, percebe que ele amava David. Se o jogador tratar isso com delicadeza, Baird vira o aliado mais leal do grupo."]}
    ]},
    { id:"greig", g:1, name:"Prof. Alasdair Greig", role:"Engenharia Civil e Mecânica (54 anos)", blocks:[
      {t:"Resumo", body:[
        "Prático, ranzinza e desconfiado de “poetas e filósofos”. Ex-engenheiro da Marinha Real, cuida da estrutura do castelo e luta para reabrir a Torre Norte."]},
      {t:"Aparência", body:["Grande, ombros largos, mãos calejadas e barba ruiva grisalha cortada rente. Macacão azul, óculos de proteção no pescoço e botas com bico de aço."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Tem as plantas do bunker de 1940, com um duto que sobe até o quarto de Elias na Ala Oeste. Tem também um relatório de 1957 que cita marcas de mão queimadas na parede do Observatório.",
        "Sabe abrir a porta de aço do bunker e conhece os túneis de serviço. Fica obcecado quando há uma passagem que não está em nenhum mapa.",
        "Ranzinza, direto, desconfiado de quem fala bonito. Respeita quem suja as mãos. Trata o castelo como um paciente velho e teimoso. Por trás da grosseria, é leal e protetor: nunca deixa um aluno se machucar numa obra.",
        "“Fantasma não derruba parede. Umidade derruba.” / “Não me diga o que você acha. Me diga o que você mediu.”"]},
      {t:"Sala e rotina", body:[
        "A Oficina Greig, nas antigas cocheiras, com bancadas, ferramentas e maquetes de pontes. A parte prática é sempre no próprio castelo.",
        "Rotina: quinze minutos de quadro, o resto com trena na mão. Quem estuda deixa segurar a trena e anotar as medidas. Quem faz bagunça manda carregar os tijolos do canto da oficina para o outro canto, e depois de volta. Quem chega atrasado recebe uma vassoura e a aula daquela pessoa vira a oficina limpa."]},
      {t:"Aula: O Castelo Não Mente, Se Você Medir", body:[
        "Engenharia Civil e Mecânica, 1º ano. Terça-feira, 9h às 11h30. Oficina Greig, claustro e adega. A engenharia é real."]},
      {t:"Parte 1: como uma pedra fica de pé (30 min, na oficina)", body:[
        "Greig fala de pé ao lado de uma maquete de arco feita de blocos de madeira, sem cola: “Bom dia. Uma pergunta: o que segura este castelo de pé há 654 anos?” Ele espera alguém dizer “o cimento” e tira um bloco do meio do arco. O arco desmorona.",
        "“Não é o cimento. Na Idade Média, a argamassa era cal e areia, fraca como bolo. O que segura é a geometria. A pedra só aguenta bem uma coisa: ser apertada. Puxada, ela quebra. O arco transforma o peso de cima em aperto, e empurra para os lados. Esse empurrão chama-se empuxo. Se nada segurar o empuxo, as paredes abrem e tudo cai.”",
        "Ele monta de novo o arco, agora com dois blocos pesados nas pontas: “Por isso, os contrafortes. Por isso, as paredes de dois metros de espessura. Escrevam.”",
        "Conceitos: compressão, força que aperta (a pedra aguenta muito bem); tração, força que puxa (a pedra aguenta muito mal); empuxo, o empurrão para os lados que todo arco faz; contraforte, pilar externo que segura o empuxo; umidade ascendente, água que sobe pelas paredes a partir do chão, o maior inimigo dos castelos escoceses."]},
      {t:"Parte 2: ler uma planta (25 min)", body:[
        "Sobre a bancada, as plantas do castelo de 1932 (as mais recentes que existem). Planta baixa: o prédio visto de cima, cortado na altura de um metro do chão. Corte: o prédio fatiado de cima a baixo, como um bolo. Elevação: a fachada vista de frente. Escala: “1:100 quer dizer que um centímetro no papel é um metro de verdade. Quem confundir a escala derruba a ponte.”",
        "Cada aluno mede na planta, com régua, o comprimento da adega. Na planta de 1932, a adega tem 14 metros."]},
      {t:"Parte 3: o levantamento (60 min, no castelo)", body:[
        "“Agora a parte boa. A planta diz uma coisa. Vamos ver o que o castelo diz.” A turma desce para a adega com trenas, lanternas e cadernos. Grupo 1: mede a adega por dentro, de parede a parede. Grupo 2: mede o mesmo trecho por fora, pelo corredor dos túneis de serviço que corre ao lado, e desconta a espessura das paredes (Greig dá o valor: 1,20 m cada).",
        "Resultado: por dentro, a adega mede 12 metros. Por fora, descontadas as paredes, deveria medir 14 metros, como na planta. Faltam dois metros.",
        "Teste: Aptidão (Matemática/Engenharia) ou Inspecionar, DT 8, para fazer as contas e perceber a diferença.",
        "Greig refaz a conta em silêncio, duas vezes. Depois vai até a estante de garrafas no fundo da adega e bate na parede atrás dela com o nó dos dedos. O som é oco. “… Isto não está em nenhuma planta. E eu tenho todas as plantas.” Ele olha para a turma e fecha o caderno: “Aula encerrada. Ninguém comenta isso. É uma parede antiga, com um vão de ventilação. Só isso. Para cima, todos.”"]},
      {t:"Parte 4: fechamento (10 min, de volta à oficina)", body:[
        "“Para terça que vem: escolham uma sala do castelo, meçam por dentro e por fora e me tragam a diferença. Se der diferente de zero, me procurem antes de contar a qualquer outra pessoa.”"]},
      {t:"Objetivos e bônus", body:[
        "Objetivos: 1. Explicar com as próprias palavras por que o arco fica de pé (empuxo e compressão). 2. Ler a escala da planta e medir a adega no papel corretamente. 3. Achar a diferença de dois metros (teste da Parte 3).",
        "Os 3 objetivos: Medida Certa, +2 em testes de Inspecionar para achar passagens, salas escondidas e fundos falsos até o fim da campanha, uma vez por sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Inspecionar até o fim da sessão.",
        "1 ou nenhum: nada, e o aluno varre a oficina."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "No fim do dia, Greig procura o aluno no claustro, com um rolo de papel debaixo do braço, e fala baixo e rápido: “Você mediu bem. Então eu vou te mostrar uma coisa que eu não mostrei a ninguém. São as plantas do abrigo da Marinha, de 1940, debaixo da Ala Oeste. Eu servi na Marinha, consegui as cópias nos arquivos de Rosyth. Olha aqui: o duto de ventilação do abrigo sobe por dentro da parede e sai no térreo da Ala Oeste. No último quarto do corredor. Sabe de quem é aquele quarto?”",
        "“E tem mais: aquela parede oca na adega não é de 1940. É muito mais velha. Pela pedra, uns trezentos anos. Alguém construiu uma escada lá dentro. Eu não acredito em fantasma. Mas eu acredito em escadas. E escada serve para descer.”",
        "O jogador fica sabendo do duto que liga o bunker ao quarto do Elias, de que a parede da adega esconde uma escada do século XVII, e ganha Greig como aliado: ele sabe abrir o bunker."]},
      {t:"Para o mestre", seg:true, body:[
        "A técnica de medir por dentro e por fora é real e é o jeito mais pé no chão de os jogadores acharem a Passagem Esquecida sem depender de sorte. Depois da aula, eles podem usar o método em qualquer sala do castelo.",
        "Greig não acredita no sobrenatural até ver com os próprios olhos. Quando acreditar, vira o aliado mais útil do grupo: abre portas, segura escadas e conhece cada túnel.",
        "Se o Elias souber que Greig mediu a adega, a estante aparece pregada na parede no dia seguinte. Greig fica furioso: “Quem mexeu na minha adega?”"]}
    ]},
    { id:"mackie", g:1, name:"Dr. Ewan Mackie", role:"Professor de Medicina e médico do Colégio (61 anos). Atende na Enfermaria às terças", blocks:[
      {t:"Resumo", body:[
        "Médico de família de Kinmorrow há 35 anos. Gentil, cansado e cauteloso. Bebe um pouco além da conta.",
        "Dá as aulas de Anatomia na antiga sala de dissecção."]},
      {t:"Aparência", body:["Alto, magro e um pouco curvado. Cabelo branco ralo penteado de lado, bigode amarelado de cachimbo e olhos azuis aguados. Óculos de leitura na ponta do nariz.",
        "Terno de tweed marrom gasto, colete com relógio de bolso e beca preta curta demais para ele. Estetoscópio e cachimbo no bolso, maleta médica de couro preto sempre na mão."]},
      {t:"Sala", body:["Teatro de Anatomia, no porão da ala sul, com acesso pela Enfermaria. Arquibancada circular de madeira em volta de uma mesa de mármore, esqueletos, órgãos em formol e pranchas vitorianas.",
        "Um arquivo de aço guarda as fichas médicas dos alunos desde 1960. Uma garrafa de uísque fica escondida dentro de um crânio de gesso."]},
      {t:"Pistas (só para o mestre)", seg:true, body:[
        "A ficha médica de Oliver Lane (1991) mostra anemia grave nos três meses antes de sumir, com a anotação “marcas no pescoço — picadas de inseto?”, riscada pelo próprio Mackie.",
        "O livro de atestados de óbito de Kinmorrow, herdado do médico anterior, tem o registro de Eleanor Hale (1888): “quase sem sangue no corpo”."]},
      {t:"Ligação com a trama (só para o mestre)", seg:true, body:[
        "Percebeu as anemias da Vigília e a de Oliver Lane, mas escolheu não perguntar. Receita ferro e se cala, por medo do Reitor e de parecer louco.",
        "Confrontado com provas, desaba e vira aliado culpado. Pode tratar Clara e o jogador mordido depois do Ato 4."]},
      {t:"Falas", body:[
        "“Tome isso três vezes ao dia. Ferro. E durma, pelo amor de Deus, durma.”",
        "“Eu vi as marcas no rapaz Lane. Escrevi ‘picada de inseto’. Em dezembro. Na Escócia.”",
        "“Um médico de aldeia aprende cedo que há perguntas que só trazem mais mortos.”"]},
      {t:"Personalidade", body:[
        "Fala devagar, com voz rouca de cachimbo. Explica tudo com paciência, como explicaria a uma família assustada. Tem as mãos firmes quando trabalha e trêmulas quando para. Evita olhar nos olhos quando o assunto é Oliver Lane."]},
      {t:"Sala e rotina", body:[
        "O Teatro de Anatomia, com a arquibancada circular de madeira em volta da mesa de mármore. Os alunos sentam em degraus, olhando para baixo, como nos teatros de dissecção do século XIX.",
        "Começa com uma história de um paciente real de Kinmorrow (sem o nome), explica a anatomia no esqueleto e termina com a prática em dupla. Quem estuda deixa usar o estetoscópio. Quem faz bagunça é convidado a se deitar na mesa de mármore e servir de paciente; a mesa é muito fria. Quem chega atrasado tem o pulso tirado e ouve quantos lances de escada subiu correndo."]},
      {t:"Aula: O Pescoço e os Primeiros Minutos", body:[
        "Medicina, 1º ano. Terça-feira, 16h às 18h. Teatro de Anatomia, porão da ala sul. A anatomia e os primeiros socorros são reais e são os ensinados nos anos 90."]},
      {t:"Parte 1: a história do paciente (10 min)", body:[
        "Mackie entra pela porta da Enfermaria, devagar, com a maleta, e senta num banquinho ao lado da mesa de mármore: “Boa tarde. Em 1972, um pescador de Kinmorrow cortou o pescoço numa corda de aço, no porto. Um corte pequeno, assim, do tamanho do meu dedo. O colega dele entrou em pânico e foi chamar o médico. Quando eu cheguei, quinze minutos depois, o homem tinha morrido. Se o colega tivesse apertado o corte com a mão, ele estaria vivo hoje.”",
        "“Esta aula não é para vocês virarem médicos. É para vocês saberem o que fazer nos primeiros minutos, antes de o médico chegar. Porque, neste castelo, o médico chega às terças.”"]},
      {t:"Parte 2: anatomia do pescoço (35 min)", body:[
        "“O pescoço é o lugar mais perigoso do corpo. Tudo o que é importante passa por um espaço do tamanho de uma garrafa.”",
        "Artéria carótida: dos dois lados da traqueia, um pouco abaixo do ângulo da mandíbula. Leva o sangue ao cérebro. É onde se sente o pulso forte. Cortada, sangra em jato.",
        "Veia jugular: mais superficial, na lateral do pescoço, pouco atrás da carótida. Traz o sangue de volta da cabeça. Cortada, sangra escuro e contínuo.",
        "Traqueia: no meio, na frente. Passagem do ar.",
        "Músculo esternocleidomastoideo: do atrás da orelha até o osso do peito. Protege a carótida e a jugular. É o cordão que salta quando a gente vira a cabeça.",
        "“Atrás da orelha e na lateral do pescoço, a jugular fica a menos de um centímetro da pele. É por isso que as perfurações ali são tão perigosas. E tão discretas.” Ele faz uma pausa longa demais nessa frase. Quem passar num teste de Intuição, DT 8, percebe que ele está pensando em alguém.",
        "O pulso: “O pulso normal de um adulto em repouso: entre 60 e 100 batidas por minuto. Abaixo disso, ou é um atleta, ou alguma coisa está errada. Quem perdeu muito sangue tem o pulso rápido e fraco, a pele fria e pálida, e confusão. Isso se chama choque.”"]},
      {t:"Parte 3: primeiros socorros (55 min)", body:[
        "ABC, o método que todo socorrista aprendia nos anos 90. A, airway (vias aéreas): o ar passa? Fazer: inclinar a cabeça para trás e levantar o queixo. B, breathing (respiração): está respirando? Fazer: olhar o peito, ouvir, sentir o ar por 10 segundos. C, circulation (circulação): tem pulso? está sangrando? Fazer: sentir a carótida e parar o sangramento.",
        "Para parar um sangramento: 1. Pressão direta, apertando a ferida com um pano limpo, ou com a mão, se não houver pano. 2. Elevação: se for num braço ou numa perna, levantar acima do coração. 3. Não tirar o pano: se encharcar, pôr outro por cima. 4. Tratar o choque: deitar a pessoa, levantar as pernas, cobrir com um casaco e não dar nada de beber.",
        "A prática em dupla: cada aluno tira o pulso do colega, na carótida e no punho, contando por 15 segundos e multiplicando por 4. Depois, Mackie deita um aluno voluntário na mesa de mármore, desenha com caneta vermelha duas pequenas marcas na lateral do pescoço, atrás da orelha, e diz: “Paciente encontrado desmaiado no claustro, de manhã. Pálido, frio, pulso a 120. Duas pequenas feridas aqui. Vocês têm dois minutos. Vão.”",
        "Teste: Medicina, DT 7, para fazer o ABC na ordem certa, apertar as feridas e tratar o choque.",
        "Se alguém perguntar “O que fez essas marcas?”, Mackie responde rápido demais: “Não importa. Num atendimento, a causa não importa. Importa o sangue que está saindo.” E guarda a caneta vermelha no bolso."]},
      {t:"Parte 4: fechamento (10 min)", body:[
        "“Para terça que vem: decorem o ABC. E cada um vai sair daqui com uma atadura no bolso. Carreguem sempre. Num castelo cheio de escadas de pedra, vocês vão precisar.” Ele entrega uma atadura de gaze a cada aluno."]},
      {t:"Objetivos e bônus", body:[
        "Objetivos: 1. Tirar o pulso do colega corretamente. 2. Dizer em ordem o que significa o ABC. 3. Fazer o atendimento simulado (teste da Parte 3).",
        "Os 3 objetivos: Mãos Firmes. O jogador aprende primeiros socorros. Uma vez por sessão, até o fim da campanha, pode estancar um sangramento ou tirar alguém do choque, recuperando 1d4 PV de um aliado, mesmo sem a perícia Medicina. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Medicina até o fim da sessão.",
        "1 ou nenhum: nada, mas ganha a atadura do mesmo jeito: “Você vai precisar mais que os outros.”"]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "A turma sobe as escadas, e Mackie pede ao aluno que fique para ajudar a guardar o esqueleto. Ele abre o crânio de gesso, serve dois dedos de uísque num copinho e não oferece: “Aquelas marcas que eu desenhei. Eu não inventei. Eu vi iguais em 1991, num rapaz de Glasgow, Oliver Lane. Anemia grave, três meses. Duas perfurações atrás da orelha. Eu escrevi ‘picada de inseto’. Em dezembro. Na Escócia.”",
        "“E eu vejo as mesmas marcas agora, nos alunos daquele clube de poesia. Eu receito ferro e me calo. Sabe por quê? Porque o último médico de Kinmorrow que fez perguntas sobre este castelo foi o meu antecessor, em 1957. Ele perguntou demais sobre o rapaz que morreu no incêndio. Seis meses depois, teve de ir embora da vila. Eu tenho sessenta e um anos e uma casa em Kinmorrow.”",
        "“Não conte a ninguém que eu disse isso. Mas, se você encontrar alguém com essas marcas, traga para mim. Eu ainda sei fechar uma ferida.”",
        "O jogador fica sabendo das marcas de 1991, de que Mackie viu as mesmas na Vigília, e de que alguém já foi expulso da vila em 1957 por fazer perguntas. E ganha Mackie como aliado culpado."]},
      {t:"Para o mestre", seg:true, body:[
        "O bônus Mãos Firmes é importante para a Cena 18 e a Cena 19, nas cavernas, onde alguém vai sangrar. Os jogadores que fizeram a aula vão agradecer ao Mackie.",
        "O atendimento simulado é o retrato exato de quem foi mordido. Se um jogador já tiver as marcas e o Mackie desenhar no mesmo lugar, o jogador sente o pescoço arder (teste de Emoção, DT 7, para não levar a mão ao pescoço na frente de todos).",
        "Se o Elias souber que o Mackie está falando, o médico aparece na terça seguinte sóbrio, frio e com uma rosa negra seca na maleta. Não dá aula. Pede licença por motivos de saúde. Os jogadores vão ter de ir até a casa dele, em Kinmorrow, para trazê-lo de volta."]}
    ]},
    { id:"duncan", g:1, name:"Prof. Duncan Reid", role:"Educação Física (45 anos)", blocks:[
      {t:"Resumo", body:[
        "Filho do zelador Angus Reid. Ex-jogador de rugby da seleção escocesa B, voltou para cuidar do pai. Treina remo e rugby e faz os calouros correrem na praia às 6h."]},
      {t:"Aparência", body:["Forte, nariz quebrado de rugby, barba de dois dias e rosto vermelho de vento. Agasalho azul-marinho com o brasão do Colégio e apito no pescoço."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Entrou nas cavernas pela praia quando era menino e ouviu “um homem cantando em latim” lá embaixo. Nunca mais voltou.",
        "A tábua das marés pregada na porta do pavilhão é essencial para entrar e sair das cavernas. Pode emprestar o barco e as cordas."]},
      {t:"Personalidade", body:[
        "Barulhento, alegre e justo. Grita o nome de todo mundo e nunca esquece nenhum. Trata os calouros com dureza de treinador, mas é o primeiro a dar o casaco a quem está com frio. É protetor com o pai e muda de expressão quando alguém fala das cavernas.",
        "“Bom dia, Brasil! Três voltas na praia. Quem chegar por último carrega os remos!” / “O mar não liga para quem você é. Ele só respeita quem respeita ele.”"]},
      {t:"Sala e rotina", body:[
        "A praia de seixos ao amanhecer, com neblina e frio, e o galpão de barcos com cheiro de madeira molhada.",
        "Rotina: corrida, aquecimento, técnica e prática na água. Quem estuda deixa ser o stroke, quem dá o ritmo no barco. Quem faz bagunça é mandado correr até o farol e voltar. Quem chega atrasado ganha uma volta a mais na praia por minuto de atraso, cronometrada."]},
      {t:"Aula: O Mar Não Espera Ninguém", body:[
        "Educação Física, 1º ano. Segunda-feira, 6h às 8h. Praia de seixos, galpão de barcos e o mar. A técnica de remo, os nós e a segurança no mar são reais."]},
      {t:"Parte 1: a corrida (20 min)", body:[
        "Ainda está escuro. Duncan espera os alunos na Escadaria dos Pescadores com uma lanterna e um apito: “Bom dia, Brasil! Bom dia, Escócia! Hoje o mar está a oito graus. Isso é quente. Em janeiro vocês vão sentir saudade de hoje. Três voltas na praia, do pé da escada até as rochas e de volta. Vai!”",
        "Teste: Atletismo, DT 6, para completar as três voltas sem parar. Quem falhar termina caminhando, e Duncan corre ao lado: “Não importa a velocidade. Importa não parar.”"]},
      {t:"Parte 2: a técnica de remo (30 min, no galpão)", body:[
        "Ele senta num barco no seco, num banco de remo, e mostra as quatro fases da remada. Pegada (catch): a pá entra na água, braços esticados, corpo inclinado para a frente. Puxada (drive): empurra com as pernas primeiro, depois o corpo, e só no fim os braços. Final (finish): a pá sai da água, mãos perto do peito. Recuperação (recovery): volta devagar para a frente, pronto para a próxima pegada.",
        "“O erro de todo calouro é remar com os braços. O remo é perna. Setenta por cento da força vem das pernas. Os braços só terminam o serviço. E o barco inteiro rema junto, no ritmo de quem está na frente. Um barco desencontrado não anda: só balança.”",
        "Nós de marinheiro: cada aluno aprende dois. Lais de guia (bowline): uma laçada que não aperta e não escorrega. “Serve para amarrar uma pessoa e puxar. O coelho sai da toca, dá a volta na árvore e volta para a toca.” Nó de escota: para amarrar duas cordas de grossuras diferentes.",
        "Teste: Aptidão ou Sobrevivência, DT 7, para dar um lais de guia certo em menos de um minuto."]},
      {t:"Parte 3: segurança na água fria (15 min)", body:[
        "“Escutem, porque isso salva vida. Se vocês caírem nesta água, o primeiro minuto é o pior. O frio faz vocês puxarem o ar sem querer, e quem está com a boca na água engole o mar. Isso se chama choque térmico. Não lutem. Fiquem de barriga para cima, com a cabeça fora, e respirem devagar até o susto passar. Depois, nadem para o barco ou fiquem parados no colete.”",
        "“Com o tempo, o frio vai tirando a força das mãos e das pernas. Por isso, no mar escocês, colete sempre. Quem entrar no meu barco sem colete volta para a praia nadando.”",
        "Ele pendura a tábua das marés na porta do galpão: “A maré sobe e desce duas vezes por dia, mais ou menos a cada doze horas e meia. Todo dia ela atrasa uns cinquenta minutos. Nas luas cheia e nova, a maré é maior: sobe mais e desce mais. Hoje, maré baixa às 7h10. Vamos aproveitar.”"]},
      {t:"Parte 4: no mar (45 min)", body:[
        "A turma entra em dois barcos de quatro remadores, com Duncan no leme de um deles. Os barcos seguem colados à falésia, para o norte, na maré baixa.",
        "Teste: Atletismo, DT 7, para remar no ritmo do barco. Falha: o barco perde o ritmo e balança. Duncan grita: “Pernas! Pernas! Todo mundo junto, comigo: pega… puxa!”",
        "O momento da cena: na volta, o barco de Duncan passa bem na frente das três bocas das cavernas, abertas na base da falésia, abaixo do castelo. A maré está baixa, e dá para ver a areia molhada entrando na escuridão. O vento sai das grutas com um som parecido com uma voz. Teste de Percepção, DT 8: o jogador ouve, por um segundo, algo que parece alguém cantando, muito baixo, lá dentro. Ou o choro de uma moça.",
        "Duncan para de remar de repente, olha para as cavernas e grita, alto demais: “Vira! Todo mundo, vira o barco! Para casa, já!” E rema de volta mais rápido do que todos."]},
      {t:"Parte 5: fechamento (10 min, no galpão)", body:[
        "“Para quarta: dez lais de guia sem errar. E ninguém, ouviram, ninguém chega perto daquelas grutas sem mim. A maré enche em quarenta minutos. Quem estiver lá dentro quando ela subir não sai.”"]},
      {t:"Objetivos e bônus", body:[
        "Objetivos: 1. Completar a corrida sem parar. 2. Dar um lais de guia correto. 3. Remar no ritmo do barco (teste da Parte 4).",
        "Os 3 objetivos: Pernas de Marinheiro, +2 em testes de Atletismo e Sobrevivência na costa, na água e nas cavernas até o fim da campanha, uma vez por sessão. E ganha a pista abaixo.",
        "2 objetivos: +1 em um teste de Atletismo até o fim da sessão.",
        "1 ou nenhum: nada, e o aluno carrega os remos de volta e lava os barcos."]},
      {t:"Pista para quem cumpriu os 3 (só para o mestre)", seg:true, body:[
        "Enquanto a turma sobe a escadaria, Duncan fica para trás com o aluno, enrolando as cordas, sem olhar para ele: “Você ouviu lá na frente das grutas, não ouviu? Eu vi a sua cara. Eu tinha doze anos. Entrei lá pela praia, na maré baixa, com dois amigos, apostando quem ia mais fundo. Eu fui o mais fundo. Lá no fim tem uma sala grande, seca. E tinha uma luz de vela. E um homem cantando em latim. Uma voz bonita, jovem. Eu corri tanto que quase me afoguei na volta. A maré já estava subindo.”",
        "“Nunca contei para o meu pai. Ele ia me dar uma surra, e depois ia ficar com medo. Ele tem medo daquelas grutas. Ele finge que não, mas tem. Se um dia você tiver que entrar lá, e eu espero que não tenha, me chama. Eu sei os horários da maré de cabeça. E tenho o barco. E não tenho mais doze anos.”",
        "O jogador fica sabendo que existe uma sala seca no fundo das cavernas, iluminada, com alguém cantando em latim, e que dá para entrar pela praia na maré baixa. Ganha também Duncan como aliado, com barco, cordas e os horários da maré."]},
      {t:"Para o mestre", seg:true, body:[
        "A aula dá aos jogadores um segundo caminho para as cavernas: pelo mar, na maré baixa, em vez de pela Passagem Esquecida da adega. Na Cena 18, se a passagem estiver bloqueada, o barco de Duncan é a alternativa.",
        "A maré pode virar relógio de tensão: na noite de 30/11, logo depois da lua cheia de 25/11, a maré ainda está alta. O grupo tem pouco tempo antes de a água fechar as saídas.",
        "O lais de guia serve para tirar alguém de um poço, de uma fenda ou da água. Se um jogador o usar nas cavernas, lembre a ele da aula.",
        "Duncan é forte e corajoso, mas tem medo das cavernas desde criança. Se ele entrar com os jogadores, faça um teste de Emoção dele na primeira vez que ouvir o canto. Se falhar, ele congela, e um jogador precisa trazê-lo de volta."]}
    ]},

    /* ---------- ALUNOS NOTÁVEIS ---------- */
    { id:"hale", g:2, name:"Lorde Julian Hale", role:"Presidente da Carrick Society (21 anos)", blocks:[
      {t:"Resumo", body:[
        "Herdeiro de uma família tradicional, arrogante e rival principal do grupo.",
        "Comanda os trotes e a vida social dos Carrick."]},
      {t:"Aparência", body:["Alto e atlético, cabelo loiro-claro penteado com perfeição, queixo quadrado e olhos azuis frios. Blazer verde da Carrick, anel de sinete de prata e relógio caro."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Não há parentesco declarado com Eleanor Hale; o sobrenome pode ser pista falsa ou um vínculo a definir. Pode ser manipulado por Vane ou usado como peça de chantagem."]}
    ]},
    { id:"vmartin", g:2, name:"Victoria Martin", role:"Aluna (20 anos)", blocks:[
      {t:"Resumo", body:[
        "Filha do Prof. Martin, ácida e elegante. Foi chamada pelos Carrick.",
        "Pode virar aliada do grupo."]},
      {t:"Aparência", body:["Ruiva escura, cabelo liso até os ombros, olhos amendoados e expressão entediada. Gola alta preta, saia de tweed e batom vinho."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Lésbica e escondida atrás da pose. “Namora” Julian Hale por conveniência social, o que a protege. Pode ser a aliada que expõe a Carrick ou a que os entrega, conforme o rumo da história."]}
    ]},
    { id:"callum", g:2, name:"Callum Ross", role:"Aluno, filho do reitor (19 anos)", blocks:[
      {t:"Resumo", body:[
        "Rebelde silencioso, toca guitarra e escuta Oasis. Recusou o convite dos Carrick.",
        "É filho do Dr. Ross, o que o afasta da reitoria."]},
      {t:"Aparência", body:["Cabelo castanho comprido até o queixo, estilo Britpop e olheiras. Jaqueta Adidas sobre a camisa do colégio, tênis Samba e walkman no pescoço."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Gay, escondido do pai. Rory, o monitor, o encobre fora do toque de recolher. Recusar os Carrick pode aproximá-lo dos bolsistas. Conhece o lado do pai e pode ser a chave para o Silentium."]}
    ]},
    { id:"megan", g:2, name:"Megan Doyle", role:"Bolsista local de Kinmorrow (20 anos)", blocks:[
      {t:"Resumo", body:[
        "Filha de pescador, bolsista local. Entende os brasileiros melhor que ninguém.",
        "É uma das vozes mais honestas do grupo."]},
      {t:"Aparência", body:["Morena, cabelo preso num rabo alto e bochechas rosadas do vento. Capa de chuva amarela, jeans e botas de borracha."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Bissexual. Era apaixonada por Clara, que sabia e continuou sua amiga. Conhece o porto e a Escadaria dos Pescadores. Pode ser guia na falésia e na praia de seixos."]}
    ]},
    { id:"rory", g:2, name:"Rory Kerr", role:"Veterano e monitor (22 anos)", blocks:[
      {t:"Resumo", body:[
        "Certinho e monitor, secretamente apaixonado por poesia. É o atual presidente da Hume Society.",
        "Leva a beca sempre abotoada com cuidado. Bissexual, ainda sem palavra para isso, e se aproximando de Callum."]},
      {t:"Aparência", body:["Alto e desajeitado, cabelo castanho bem curto e óculos redondos. Beca sempre abotoada e distintivo de monitor no peito."]},
      {t:"Segredos e enredo", seg:true, body:[
        "A Hume Society guarda as atas desde 1789 na Sala de Mapas. Pode ser fonte de histórias do passado do colégio."]}
    ]},
    { id:"lucy", g:2, name:"Lucy Bell", role:"Aluna, neta da governanta (19 anos)", blocks:[
      {t:"Resumo", body:[
        "Tímida e observadora, neta de Mrs. Bell. Desenha tudo num caderno e percebe detalhes que os outros ignoram."]},
      {t:"Aparência", body:["Pequena, cabelo preto curtinho com franja e olhos grandes. Suéter enorme da avó e caderno de desenho debaixo do braço."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Assexual, sem palavra para isso. Por isso o charme de Elias não tem onde agarrar: o Encanto tem −4 contra ela, e ela não consegue desenhar o rosto dele. O caderno de desenhos pode guardar registros visuais de Clara, de Elias ou das ruínas de São Fergus. Sugestão do mestre: use como pista visual."]}
    ]},
    { id:"vane", g:2, name:"Elias Vane", role:"Veterano de Filosofia, 3º ano. Aparenta 20 anos. Na verdade, Thomas Carne", blocks:[
      {t:"Resumo", body:[
        "Veterano do terceiro ano de Filosofia, “transferido de Oxford” em 1994. Culto, engraçado e generoso; fala um pouco de português e adora música brasileira.",
        "Faz questão de ser o primeiro amigo dos bolsistas: empresta casacos, mostra passagens secretas e livra-os de punições."]},
      {t:"Aparência", body:["Pele pálida e lisa, cabelo preto ondulado caindo na testa e olhos cinza-claros que parecem prateados à luz de velas. Mãos sempre frias. Sobretudo preto longo, suéter de gola alta e anel antigo de prata. Nunca aparece em fotos de grupo."]},
      {t:"Segredos e enredo do mestre", seg:true, body:[
        "Identidade real: Thomas Carne (ver aba Vilão). Fundador da Vigília, sua “estufa”. O convite é feito com uma rosa negra no escaninho.",
        "Placar de afeto: anote confidências, favores aceitos, tempo a sós e convites aceitos. Quem tiver o maior placar no Ato 4 (30/nov) é levado às cavernas para o ritual de renovação.",
        "O livro: dá a cada escolhido um exemplar de O Pequeno Príncipe com dedicatória “Para …, que ainda não sabe que é único no mundo. Você me cativou. — E.”. Aceitar vale +1; recusar ou devolver vale −2, e ele fica magoado e depois frio.",
        "Pistas: nunca come no Great Hall; não aparece em fotos; mãos frias; conhece detalhes da história que ninguém sabe; o retrato de Thomas Carne no Great Hall se parece com ele, mais velho; o trevo de Clara aparece no quarto dele."]}
    ]},
    { id:"clara", g:2, name:"Clara Bennett", role:"Aluna de Letras, monitora do Programa Atlântico (20 anos). Desaparecida", blocks:[
      {t:"Resumo", body:[
        "Simpática e luminosa, a mais bonita do colégio segundo metade dos alunos. Entrou no Colégio em 1995 e é monitora voluntária do Programa Atlântico. Recebeu os bolsistas na chegada, em 15 de setembro.",
        "Naquela noite saiu para encontrar Elias nas Ruínas de São Fergus e nunca voltou. A reitoria disse que ela “voltou para casa por motivos familiares”."]},
      {t:"Aparência", body:["Cabelo loiro-mel comprido e ondulado, olhos verdes, sardas leves e sorriso largo. Casaco xadrez vermelho, cachecol creme e botas de montaria. Usava um cordão com pingente de trevo de prata."]},
      {t:"Segredos e enredo do mestre", seg:true, body:[
        "Está viva, presa nas cavernas como reserva de sangue e futura serva. Apaixonada por Elias, escolheu ser monitora por isso.",
        "Pista: o exemplar de Clara do livro tem a mesma dedicatória e data de setembro de 1995. O “presente” não era único.",
        "Gravação de hipnose feita por Morag em agosto de 1996: “um rapaz que me beija o pescoço e o mundo fica em silêncio”.",
        "Troféu de Carne: o pingente de trevo de prata, que ele carrega no bolso."]}
    ]},

    /* ---------- OUTROS BOLSISTAS ---------- */
    { id:"renato", g:3, name:"Renato Lima", role:"Bolsista carioca (20 anos)", blocks:[
      {t:"Resumo", body:[
        "Carioca, toca violão e samba. É o coração da turma.",
        "Tenta reunir todo mundo quando o grupo se separa."]},
      {t:"Aparência", body:["Negro, alto, cabelo raspado e sorriso enorme. Camisa do Flamengo por baixo do casaco emprestado e violão nas costas."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Âncora emocional do grupo. Pode ser o primeiro a notar que Vane é diferente do que parece."]}
    ]},
    { id:"camila", g:3, name:"Camila Duarte", role:"Bolsista mineira, Letras (19 anos)", blocks:[
      {t:"Resumo", body:[
        "Mineira, estudiosa de Letras, quer ser escritora.",
        "Anota tudo e sempre tem um livro e uma caneta atrás da orelha."]},
      {t:"Aparência", body:["Morena clara, cabelo castanho cacheado e volumoso, óculos de aro grosso. Sempre com um livro e uma caneta atrás da orelha."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Pode se ligar aos poemas de Eleanor Hale e ao caderno que é troféu de Carne. Sua escrita pode decifrar as anotações da Arca."]}
    ]},
    { id:"diego", g:3, name:"Diego Torres", role:"Bolsista gaúcho, Direito (21 anos)", blocks:[
      {t:"Resumo", body:[
        "Gaúcho, cursa Direito. Competitivo e orgulhoso, entra em conflito com Julian Hale e com a Carrick.",
        "Levou uma cuia de chimarrão escondida na mala."]},
      {t:"Aparência", body:["Branco, cabelo loiro-escuro curto com gel e porte de atleta. Jaqueta jeans, botas e a cuia de chimarrão escondida na mala."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Gay, muito escondido: a família espera que ele volte, case e assuma a fazenda. Elias percebe o segredo e oferece exatamente o que ele quer ouvir: “aqui você pode ser quem quiser”. O orgulho pode ser explorado: é um alvo fácil para a disputa de afeto com Vane ou para um convite à Vigília."]}
    ]},
    { id:"bianca", g:3, name:"Bianca Nunes", role:"Bolsista baiana, Biologia (20 anos)", blocks:[
      {t:"Resumo", body:[
        "Baiana, estuda Biologia. Cética e corajosa, vai à falésia sem medo.",
        "Destoa do castelo com seu estilo próprio."]},
      {t:"Aparência", body:["Negra, tranças longas, colares de miçangas e um casaco de nylon colorido que destoa de tudo no castelo."]},
      {t:"Segredos e enredo", seg:true, body:[
        "Pode propor testes científicos sobre as cavernas e é aliada natural de Fiona Kerr."]}
    ]},

    { id:"kirsty", g:11, name:"Kirsty Fraser", role:"Dona do sebo Fraser's Books, em Stonehaven (28 anos)", blocks:[
      {t:"Resumo", body:[
        "Corajosa, engraçada e protetora. Sem paciência para se esconder.",
        "Papel: dona do sebo Fraser's Books, em Stonehaven. Não é da faculdade; é uma amiga de Edimburgo para o castelo."]},
      {t:"Aparência", body:["Ruiva, muitas sardas, olhos verdes e sorriso largo. Cabelo raspado dos lados e comprido em cima. Argolinhas na orelha e piercing no nariz.",
        "Jaqueta de couro preta com bottons, camiseta de banda dos anos 90, jeans rasgado e coturnos pretos. Camisa xadrez amarrada na cintura e sacola de lona cheia de livros."]},
      {t:"Local: Fraser's Books", body:["Sebo de dois andares em Stonehaven, com pilhas tortas de livros, um gato chamado Hume e café de graça para estudantes."]},
      {t:"Pistas (só para o mestre)", seg:true, body:[
        "Vende livros antigos sobre a Escócia, entre eles um com uma gravura de 1890 de “E. Lyall, tutor de piano”."]},
      {t:"Segredo (só para o mestre)", seg:true, body:[
        "Namora a Dra. Morag Lindsay desde 1993, em segredo. Oficialmente é “uma amiga de Edimburgo”.",
        "Escreve para Morag pelos Correios de Kinmorrow, sem remetente. Elias ameaça usar uma fita gravada por ela para chantagear Morag. Pode virar porto seguro dos jogadores fora do castelo."]},
      {t:"Falas", body:[
        "“Vocês são os amigos da Morag? Entrem, o café é ruim, mas é quente.”",
        "“Ela tem medo por nós duas. Eu tenho raiva por nós duas. A gente se equilibra.”"]}
    ]},

    /* ---------- VILÃO ---------- */
    { id:"carne", g:4, vilao:true, name:"Thomas Carne", role:"Vilão. Identidade atual: Elias Vane", blocks:[
      {t:"Identidade", body:[
        "Reitor acusado de práticas ocultas em 1662, absolvido misteriosamente e morto um ano depois, aos 91 anos, segundo o registro oficial.",
        "Na verdade fez um pacto de Sangue com uma entidade do Outro Lado e tornou-se vampiro. Desde então dorme por longos ciclos nas cavernas (e, desde a guerra, no bunker) e volta sob novas identidades. Depois do incêndio de 1957, que o deixou ferido e faminto, os ciclos encurtaram: ele desperta por alguns meses a cada década (1963, 1977, 1991) e está acordado sem parar desde 1994. Hoje é Elias Vane."]},
      {t:"Como ele se alimenta", body:[
        "Escolhe jovens apaixonados por arte, beleza e eternidade. A Vigília é a sua “estufa”: vinho, poesia, intimidade e promessas de genialidade. Bebe pouco de cada vez, criando dependência; alguns escolhidos são convertidos em servos."]},
      {t:"Perfil psicológico", body:[
        "Psicopata clínico, muito antes de ser vampiro. Não sente culpa, só tédio.",
        "Não odeia as vítimas: coleciona-as. Cada jovem é uma obra inacabada que ele “completa” ao tirá-la do tempo. Vê-se como curador da beleza, não como assassino.",
        "O que mais o excita é o momento em que a vítima percebe que confiou na pessoa errada."]},
      {t:"Os cinco tempos da caça", ol:true, body:[
        "Observar: semanas só olhando. Escolhe o solitário, o deslocado, o saudoso e o bolsista pobre. Anota num caderno de couro, com letra caligráfica do século XVII.",
        "Espelhar: torna-se exatamente o que a vítima precisa: melhor amigo, alma gêmea ou cúmplice.",
        "Isolar: afasta a vítima dos outros com pequenas brigas, segredos revelados e encontros noturnos só a dois.",
        "Provar: bebe pouco, em várias noites, com a vítima entorpecida pelo vinho da Vigília. Ela acorda pálida, com marcas atrás da orelha ou no pulso, e dependente dele.",
        "Colher: numa noite simbólica, leva a vítima a um lugar isolado (ruínas, falésia, estufa), revela quem é e só depois a mata ou a leva para as cavernas."]},
      {t:"Assinatura", body:[
        "Guarda troféus numa caixa de música de ébano no bunker, cada um com etiqueta de nome e data.",
        "Deixa uma rosa negra seca onde a vítima foi vista pela última vez.",
        "Encobre tudo com acidente, fuga ou “motivos familiares”, contando com o Silentium e com servos como Silas Moore.",
        "Após cada ciclo de caça, volta a dormir e desaparece da memória do colégio. Só ficam rastros: um rosto desfocado numa foto de turma, um nome riscado num registro."]},
      {t:"Fraquezas", body:[
        "Vaidoso e precisa ser admirado; não resiste a uma plateia.",
        "Subestima quem é leal ao grupo, e não a ele.",
        "Se uma vítima o rejeita, fica obcecado e começa a cometer erros."]},
      {t:"Vítima 1662 — Margaret Lyall, a criada", seg:true, body:[
        "Escolhida como testemunha contra ele, e para completar o pacto de Sangue. Carne foi gentil por semanas, ensinou-a a ler e deu-lhe um livro de salmos. Na véspera do depoimento, chamou-a à capela para “rezarem juntos” e a sangrou sobre o altar de pedra das cavernas. A acusação caiu por falta de testemunha.",
        "Troféu: o livro de salmos, com o nome dela."]},
      {t:"Vítimas 1746 — três jacobitas e três Custodes", seg:true, body:[
        "Conquistou os oficiais escondidos nas cavernas levando comida e notícias, sob o nome de um irmão da Ordem da Chave. Matou-os um a um na maré alta, dizendo que o companheiro “fugira num barco”.",
        "Quando três Custodes desceram para investigar, ele os afogou na maré alta. Foi o fim da Ordem da Chave. Troféus: um cocar branco jacobita e três chaves de ferro."]},
      {t:"Vítima 1888 — Eleanor Hale", seg:true, body:[
        "Voltou como “Edward Lyall”, tutor de piano. Eleanor tinha 19 anos, escrevia poemas e se sentia sufocada pela família. Ele leu os poemas dela em voz alta e prometeu publicá-los em Londres. Durante o outono, ela foi ficando pálida e distante das amigas.",
        "Na noite de 31 de outubro, levou-a à falésia para “ver o mar sob a lua”. Quando ela entendeu quem ele era e tentou fugir pela borda, ele a deixou cair. O corpo quase não tinha sangue, o que o médico de Kinmorrow registrou e a reitoria mandou esquecer. Troféu: o caderno de poemas dela."]},
      {t:"Vítima 1920 — Agnes Murray, a última Irmã", seg:true, body:[
        "Descobriu o padrão de desaparecimentos e o nome “Lyall” em 1662 e 1888. Carne, ainda desperto, não a seduziu: apenas a vigiou. Na noite em que ia levar as provas ao bispo de Aberdeen, foi vista pela última vez entrando na estufa.",
        "As Irmãs foram dissolvidas na semana seguinte e Carne voltou a dormir. Troféu: o broche de lírio da sociedade. Os diários dela continuam sob o piso da Estufa Victoria, que ele nunca encontrou."]},
      {t:"Vítima 1957 — David Shaw, o incêndio da Torre Norte", seg:true, body:[
        "Aluno de astronomia que passava as noites no Observatório. Carne despertou com fome e o atacou lá em cima; David reagiu com uma lamparina de querosene e a torre pegou fogo.",
        "Carne escapou e é a única vez em que foi ferido: tem uma cicatriz de queimadura nas costas que nunca sarou. Troféu: um astrolábio de latão derretido."]},
      {t:"Vítima 1991 — Oliver Lane", seg:true, body:[
        "Bolsista, filho de mineiro de Glasgow, tímido e humilhado pelos Carrick. Carne apareceu como colega de quarto temporário, defendeu-o dos trotes e, aos poucos, bebeu dele. Oliver passou a idolatrá-lo e chegou a pedir para “ser igual a ele”.",
        "Na véspera do Natal, levou-o às cavernas para transformá-lo em servo. Oliver não sobreviveu. Os restos estão numa gruta lateral, sob pedras. Troféu: a carteira de estudante."]},
      {t:"Vítima 1996 — Clara Bennett (viva)", seg:true, body:[
        "Conquistada ao longo de 1995 e 1996: Clara se apaixonou por ele e topou ser monitora do Programa Atlântico para ajudá-lo a “conhecer os brasileiros”, sem saber que escolhia as próximas vítimas. Na noite de 15 de setembro, após o jantar de boas-vindas, foi levada às ruínas, beijada e mordida.",
        "Está presa nas cavernas, fraca e meio enfeitiçada. Carne planeja convertê-la em serva no ritual de 30 de novembro, junto com o jogador escolhido."]},
      {t:"Vítimas desconhecidas", seg:true, body:[
        "Na caverna, Carne diz ter colecionado “treze”. O dossiê soma onze mortos e Clara. As outras duas nem os arquivos registraram: dois troféus sem etiqueta na caixa de música, um gancho para uma segunda temporada."]},
      {t:"O Pequeno Príncipe na trama", seg:true, body:[
        "Carne lê o livro como manual de caça. A raposa ensina a “cativar” (criar laços devagar e aparecer sempre na mesma hora). A serpente é a personagem com quem ele se identifica, e a mordida é um presente, um caminho para a eternidade. A rosa sob a redoma é a vítima favorita.",
        "Há três exemplares: o do presente (edição francesa da Gallimard, dedicatória em sépia assinada “E.”); o de Clara (mesma dedicatória e data de setembro de 1995); e o de Carne, na Arca (primeira edição de Nova York, 1943, com os nomes das vítimas nas margens e, ao lado da serpente, “Moi.”). No mapa dos vulcões, os dois ativos são a Sala das Caldeiras e o bunker; o extinto é a estante da adega.",
        "No clímax, o encanto pode ser quebrado se um amigo ler em voz alta a fala da raposa sobre o que cativar significa de verdade. Mecânica sugerida: teste de Vontade ou Diplomacia, com bônus se ele tiver lido o livro em cena."]},
      {t:"No combate final", seg:true, body:[
        "Rodada 1: ele fala e oferece a eternidade; a Vaidade o prende aqui. Rodadas 2 e 3: usa Encanto no mais vulnerável e manda o encantado atacar os amigos. Abaixo da metade dos PV: entra na forma verdadeira e usa Chamado do Sangue. Se perder: tenta Passo na sombra até o mar; se o altar estiver inteiro, sobrevive para uma segunda temporada."]},
      {t:"Dica do mestre", body:[
        "A caixa de música no bunker revela toda a história de uma vez. É um ótimo momento de virada no Ato 3 ou 4."]}
    ]}
  ];

  /* ---------- utilidades ---------- */
  function norm(s){
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  var tabsEl = document.getElementById("tabs");
  var panelsEl = document.getElementById("panels");
  var buscaEl = document.getElementById("busca");
  var vazioEl = document.getElementById("vazio");
  var contagemEl = document.getElementById("contagem");

  function listaSimples(titulo, texto){
    var box = el("div", "ficha-sec");
    box.appendChild(el("h4", null, titulo));
    var partes = String(texto || "").split(";").map(function(s){ return s.trim(); }).filter(Boolean);
    if (!partes.length || (partes.length === 1 && partes[0] === "—")) partes = ["Nenhum"];
    var ul = el("ul");
    partes.forEach(function(p){ ul.appendChild(el("li", null, p)); });
    box.appendChild(ul);
    return box;
  }

  function buildFicha(f){
    var art = el("article", "block ficha");
    art.appendChild(el("h3", null, "Ficha"));

    var stats = el("div", "stats");
    [["Nível", f.nivel, ""], ["Físico", f.F, ""], ["Mente", f.M, ""], ["Emoção", f.E, ""], ["PV", f.PV, "pv"], ["PD", f.PD, "pd"]]
      .forEach(function(s){
        var box = el("div", "stat" + (s[2] ? " " + s[2] : ""));
        box.appendChild(el("span", "k", s[0]));
        box.appendChild(el("strong", null, String(s[1])));
        stats.appendChild(box);
      });
    art.appendChild(stats);

    var nomes = Object.keys(f.pericias || {});
    if (nomes.length) {
      var sec = el("div", "ficha-sec");
      sec.appendChild(el("h4", null, "Perícias"));
      var ulp = el("ul", "pericias");
      nomes.forEach(function(n){ ulp.appendChild(el("li", null, n + " " + f.pericias[n])); });
      sec.appendChild(ulp);
      art.appendChild(sec);
    }

    art.appendChild(listaSimples("Ataques", f.ataques));
    art.appendChild(listaSimples("Itens", f.itens));
    art.appendChild(listaSimples("Poderes e habilidades", f.poderes));
    return art;
  }

  function buildAula(a){
    var art = el("article", "block aula");
    art.appendChild(el("h3", null, "Aula"));
    [["Matéria e horário", a.materia], ["Conteúdo", a.conteudo], ["Cena sugerida", a.cena], ["Teste", a.teste]]
      .forEach(function(s){
        var p = el("p");
        p.appendChild(el("strong", null, s[0] + ". "));
        p.appendChild(document.createTextNode(s[1]));
        art.appendChild(p);
      });
    var m = el("div", "mestre");
    m.appendChild(el("h4", null, "Mestre"));
    m.appendChild(el("p", null, a.mestre));
    art.appendChild(m);
    return art;
  }

  function buildPersonalidade(p){

  /* ---------- aba Mapa ---------- */
  var zonaAtiva = null, zonasEls = [], chipEls = [];

  function marcaChips(){
    chipEls.forEach(function(c){
      c.el.setAttribute("aria-pressed", c.valor === zonaAtiva ? "true" : "false");
    });
  }

  // Esconde zonas sem nenhum local visível (busca) ou fora do filtro escolhido
  function atualizaZonas(){
    zonasEls.forEach(function(z, zi){
      var algum = z.locais.some(function(l){ return !l.el.hidden; });
      z.wrap.hidden = (zonaAtiva !== null && zonaAtiva !== zi) || !algum;
    });
  }

  /* ---------- montagem do mapa ---------- */
  var CHAVE_ACHADOS = "sanctum-achados";
  function carregaAchados(){
    try {
      var v = JSON.parse(localStorage.getItem(CHAVE_ACHADOS) || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function salvaAchados(lista){
    try { localStorage.setItem(CHAVE_ACHADOS, JSON.stringify(lista)); } catch (e) {}
  }

  function buildMapa(){
    var btn = el("button", "tab", "Mapa");
    btn.type = "button";
    btn.id = "tab-mapa";
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", "false");
    btn.setAttribute("aria-controls", "p-mapa");
    groupEls[5].bar.appendChild(btn);

    var panel = el("section", "panel");
    panel.id = "p-mapa";
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", btn.id);
    panel.hidden = true;
    panel.appendChild(el("h2", null, "Mapa de Dunraven Hall"));
    panel.appendChild(el("p", "cargo", "Pontos de interesse por zona. Os achados marcados ficam salvos neste navegador."));

    var filtro = el("div", "filtro");
    filtro.setAttribute("role", "group");
    filtro.setAttribute("aria-label", "Filtrar por zona");
    chipEls = [];
    function novoChip(txt, valor){
      var c = el("button", "chip", txt);
      c.type = "button";
      c.addEventListener("click", function(){
        zonaAtiva = valor;
        marcaChips();
        atualizaZonas();
      });
      filtro.appendChild(c);
      chipEls.push({ el: c, valor: valor });
    }
    novoChip("Todas", null);
    ZONA_ORDEM.forEach(function(letra, zi){ novoChip(ZONA_NOMES[letra], zi); });
    panel.appendChild(filtro);

    var marcados = carregaAchados();
    var recs = [];
    zonasEls = [];
    ZONA_ORDEM.forEach(function(letra){
      var wrap = el("section", "zona");
      wrap.appendChild(el("h3", null, ZONA_NOMES[letra]));
      var zl = [];

      PONTOS.forEach(function(p, pi){
        if (p.zona !== letra) return;
        var art = el("article", "local");
        art.appendChild(el("h4", null, p.nome));
        art.appendChild(el("p", null, p.desc));

        var npcP = el("p", "npc");
        npcP.appendChild(el("strong", null, "NPC presente. "));
        npcP.appendChild(document.createTextNode(p.npc));
        art.appendChild(npcP);

        var textos = [ZONA_NOMES[letra], p.nome, p.desc, p.npc, p.mestre];
        if (p.achados && p.achados.length) {
          art.appendChild(el("h5", null, "Achados"));
          p.achados.forEach(function(a, ai){
            var chave = pi + "-" + ai;
            var box = el("div", "achado");
            box.appendChild(el("p", "achado-nome", a.nome));
            [["Teste", a.teste], ["Se der certo", a.ok], ["Se falhar", a.falha]].forEach(function(s){
              var q = el("p");
              q.appendChild(el("strong", null, s[0] + ". "));
              q.appendChild(document.createTextNode(s[1]));
              box.appendChild(q);
              textos.push(s[1]);
            });
            textos.push(a.nome);

            var bt = el("button", "marca", "Marcar como encontrado");
            bt.type = "button";
            var pinta = function(){
              var on = marcados.indexOf(chave) !== -1;
              box.classList.toggle("encontrado", on);
              bt.textContent = on ? "Encontrado" : "Marcar como encontrado";
              bt.setAttribute("aria-pressed", on ? "true" : "false");
            };
            bt.addEventListener("click", function(){
              var i = marcados.indexOf(chave);
              if (i === -1) marcados.push(chave); else marcados.splice(i, 1);
              salvaAchados(marcados);
              pinta();
            });
            box.appendChild(bt);
            pinta();
            art.appendChild(box);
          });
        }

        var mp = el("p", "mestre-linha");
        mp.appendChild(el("strong", null, "Mestre. "));
        mp.appendChild(document.createTextNode(p.mestre));
        art.appendChild(mp);

        wrap.appendChild(art);
        var rec = { el: art, text: norm(textos.join(" ")) };
        zl.push(rec);
        recs.push(rec);
      });

      panel.appendChild(wrap);
      zonasEls.push({ wrap: wrap, locais: zl });
    });

    panelsEl.appendChild(panel);
    marcaChips();
    return {
      id: "mapa",
      g: 5,
      btn: btn,
      panel: panel,
      head: norm("Mapa de Dunraven Hall pontos de interesse"),
      blocks: recs
    };
  }

  /* ---------- aba Bíblia (texto em biblia-dunraven.js) ---------- */
  // Negrito aceita itálico dentro (ex.: **O minuto de *Silentium*.**)
  function inlineNodes(texto){
    var frag = document.createDocumentFragment();
    String(texto).replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").split(/(\*\*(?!\s)[\s\S]+?\*\*(?!\*))/).forEach(function(parte){
      if (!parte) return;
      if (/^\*\*(?!\s)[\s\S]+\*\*$/.test(parte) && parte.length > 4) {
        var st = el("strong");
        st.appendChild(italicNodes(parte.slice(2, -2)));
        frag.appendChild(st);
      } else {
        frag.appendChild(italicNodes(parte));
      }
    });
    return frag;
  }
  function italicNodes(t){
    var f = document.createDocumentFragment();
    t.split(/(\*[^*\s][^*]*\*)/).forEach(function(p){
      if (!p) return;
      if (/^\*[^*\s][^*]*\*$/.test(p)) f.appendChild(el("em", null, p.slice(1, -1)));
      else f.appendChild(document.createTextNode(p.replace(/\\(.)/g, "$1")));
    });
    return f;
  }

  // Converte o markdown da Bíblia em blocos: "## " abre um bloco, "### " um subtítulo
  // cfg: {id, label, group, titulo, prefixo} — sem cfg, monta a aba inteira "Bíblia"
  function buildBiblia(cfg){
    cfg = cfg || { id: "biblia", label: "Bíblia", group: 7, titulo: "Bíblia de Dunraven Hall", prefixo: null };
    var btn = el("button", "tab", cfg.label);
    btn.type = "button";
    btn.id = "tab-" + cfg.id;
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", "false");
    btn.setAttribute("aria-controls", "p-" + cfg.id);
    groupEls[cfg.group].bar.appendChild(btn);

    var panel = el("section", "panel biblia");
    panel.id = "p-" + cfg.id;
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", btn.id);
    panel.hidden = true;
    var titulo = el("h2", null, cfg.titulo);
    var cargo = el("p", "cargo");
    panel.appendChild(titulo);
    panel.appendChild(cargo);

    var fonte = cfg.fonte !== undefined ? cfg.fonte : window.BIBLIA_MD;
    var todas = String(fonte || "").replace(/\r/g, "").split("\n");
    var linhas = todas;
    if (cfg.prefixo) {
      // Recorta do cabeçalho "## ..." que começa com o prefixo até o próximo "## "
      var ini = -1;
      for (var k = 0; k < todas.length; k++) { if (todas[k].indexOf(cfg.prefixo) === 0) { ini = k; break; } }
      linhas = [];
      if (ini >= 0) {
        var fim = ini + 1;
        while (fim < todas.length && !/^## /.test(todas[fim])) fim++;
        linhas = todas.slice(ini, fim);
      }
    }
    var blocos = [];
    var atual = null, par = [], lista = null, ultimoLi = null, ultimoSub = null, tab = [];
    var bq = null, bqPar = [];

    // Texto fora de qualquer "## " (byline, intro) ganha um bloco sem título
    function garantir(){
      if (!atual) { atual = el("article", "block"); panel.appendChild(atual); blocos.push(atual); }
    }
    function bqFlush(){
      if (bq && bqPar.length) { var p = el("p"); p.appendChild(inlineNodes(bqPar.join(" "))); bq.appendChild(p); }
      bqPar = [];
    }
    function bqEnd(){ bqFlush(); bq = null; }

    function fechaTab(){
      var rows = tab.filter(function(r){ return !/^\s*\|?\s*:?-{3,}/.test(r); });
      tab = [];
      if (!rows.length) return;
      garantir();
      var t = el("table", "biblia-tabela");
      rows.forEach(function(r, idx){
        var cells = r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|");
        var tr = el("tr");
        cells.forEach(function(c){
          var td = el(idx === 0 ? "th" : "td");
          td.appendChild(inlineNodes(c.trim()));
          tr.appendChild(td);
        });
        t.appendChild(tr);
      });
      atual.appendChild(t);
    }

    function fechaPar(){
      if (par.length && atual) {
        var p = el("p");
        p.appendChild(inlineNodes(par.join(" ")));
        atual.appendChild(p);
      }
      par = [];
    }
    function fechaLista(){ lista = null; ultimoLi = null; ultimoSub = null; }
    function abreBloco(t){
      fechaPar(); fechaLista();
      atual = el("article", "block");
      atual.appendChild(el("h3", null, t));
      panel.appendChild(atual);
      blocos.push(atual);
    }
    function addItem(tag, ind, texto){
      garantir();
      fechaPar();
      var li = el("li");
      li.appendChild(inlineNodes(texto));
      if (ind > 0 && ultimoLi) {
        if (!ultimoSub) { ultimoSub = el(tag); ultimoLi.appendChild(ultimoSub); }
        ultimoSub.appendChild(li);
      } else {
        if (!lista || lista.tagName.toLowerCase() !== tag) { lista = el(tag); atual.appendChild(lista); }
        lista.appendChild(li);
        ultimoLi = li;
        ultimoSub = null;
      }
    }

    linhas.forEach(function(raw){
      var m;
      if (/^>/.test(raw)) {
        var txt = raw.replace(/^>\s?/, "").trim();
        if (!atual && !cargo.hasChildNodes()) { if (txt) cargo.appendChild(inlineNodes(txt)); return; }
        garantir();
        if (!bq) { fechaPar(); fechaLista(); bq = el("blockquote"); atual.appendChild(bq); }
        if (txt) bqPar.push(txt); else bqFlush();
        return;
      }
      if (bq) bqEnd();
      if (/^\s*\|/.test(raw)) { fechaPar(); fechaLista(); tab.push(raw); return; }
      if (tab.length) fechaTab();
      if (/^\s*---+\s*$/.test(raw)) { fechaPar(); fechaLista(); return; }
      if (/^# /.test(raw)) { titulo.textContent = raw.slice(2); return; }
      if (/^## /.test(raw)) { abreBloco(raw.slice(3)); return; }
      if (/^### /.test(raw)) {
        fechaPar(); fechaLista();
        garantir();
        atual.appendChild(el("h4", null, raw.slice(4)));
        return;
      }
      if (/^\s*$/.test(raw)) { fechaPar(); fechaLista(); return; }
      if ((m = /^(\s*)- (.*)$/.exec(raw))) { addItem("ul", m[1].length, m[2]); return; }
      if ((m = /^(\s*)\d+\. (.*)$/.exec(raw))) { addItem("ol", m[1].length, m[2]); return; }
      garantir();
      par.push(raw.trim());
    });
    if (bq) bqEnd();
    if (tab.length) fechaTab();
    fechaPar(); fechaLista();

    panelsEl.appendChild(panel);
    return {
      id: cfg.id,
      g: cfg.group,
      btn: btn,
      panel: panel,
      head: norm(cfg.titulo + " Dunraven Hall Sanctum " + cfg.label),
      blocks: blocos.map(function(art){ return { el: art, text: norm(art.textContent) }; })
    };
  }

  var groupEls = [];

  items.push(buildMapa());

  items.push(buildBiblia());

  // Seções da Bíblia como abas próprias (texto vindo de BIBLIA_MD, sem transcrição manual)
  [
    { id: "visao",     label: "Visão Geral",          group: 8, prefixo: "## 1. ",  titulo: "Visão Geral" },

  /* ---------- links para as abas dos NPCs ---------- */
  // Aliases em ordem livre: a busca usa sempre a forma mais longa primeiro.
  // Os ids de destino são os das abas no HTML (ex.: "ross" para Malcolm Ross).
  var ALIASES = [
    ["Malcolm Ross","ross"], ["Dr. Ross","ross"], ["Reitor Ross","ross"],
    ["Gerald Hunt","hunt"], ["Mr. Hunt","hunt"], ["Hunt","hunt"],
    ["Agnes Bell","bell"], ["Mrs. Bell","bell"],

  ];

  var ALIAS_ALVO = {};
  ALIASES.forEach(function(x){ ALIAS_ALVO[x[0]] = x[1]; });
  var ALIAS_RE = new RegExp(
    "(?<![\\p{L}\\p{N}])(" +
    ALIASES.slice()
      .sort(function(a, b){ return b[0].length - a[0].length; })
      .map(function(x){ return x[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); })
      .join("|") +
    ")(?![\\p{L}\\p{N}])", "gu");

  function reduzMovimento(){
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function cargoDe(alvo){
    var it = items.filter(function(x){ return x.id === alvo; })[0];
    var c = it && it.panel.querySelector(".cargo");
    return c ? c.textContent : "";
  }

  // Troca nomes por links só nos nós de texto visíveis (fora de a, button, h2, script e style)
  function ligaNoTexto(raiz, selfId){
    var andador = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        for (var p = n.parentNode; p && p !== raiz; p = p.parentNode) {
          var t = p.nodeName;
          if (t === "A" || t === "BUTTON" || t === "H2" || t === "SCRIPT" || t === "STYLE") return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nos = [];
    while (andador.nextNode()) nos.push(andador.currentNode);

    nos.forEach(function(no){
      var txt = no.nodeValue;
      var re = new RegExp(ALIAS_RE.source, ALIAS_RE.flags);
      var partes = [], ultimo = 0, m;
      while ((m = re.exec(txt)) !== null) {
        var alvo = ALIAS_ALVO[m[1]];
        // "Victoria" dentro de "Estufa Victoria" é o nome da estufa, não da aluna
        if (m[1] === "Victoria" && txt.slice(Math.max(0, m.index - 7), m.index) === "Estufa ") continue;
        // evita autolink: não linka o NPC da própria aba
        if (alvo === selfId) continue;
        partes.push(txt.slice(ultimo, m.index));
        partes.push({ alvo: alvo, texto: m[1] });
        ultimo = m.index + m[1].length;
      }
      if (!partes.length) return;
      partes.push(txt.slice(ultimo));

      var pai = no.parentNode;
      partes.forEach(function(p){
        if (typeof p === "string") {
          if (p) pai.insertBefore(document.createTextNode(p), no);
        } else {
          var a = el("a", "npc-link", p.texto);
          a.href = "#" + p.alvo;
          a.dataset.alvo = p.alvo;
          a.dataset.cargo = cargoDe(p.alvo);
          pai.insertBefore(a, no);
        }
      });
      pai.removeChild(no);
    });
  }

  function irParaNpc(alvo){
    var it = items.filter(function(x){ return x.id === alvo; })[0];
    if (!it) return;
    if (buscaEl.value) { buscaEl.value = ""; filtrar(); }
    activate(it, true);
    var titulo = it.panel.querySelector("h2") || it.panel;
    titulo.scrollIntoView({ behavior: reduzMovimento() ? "auto" : "smooth", block: "start" });
  }

  document.addEventListener("click", function(ev){

    if (!a) return;

  items.forEach(function(it){ ligaNoTexto(it.panel, it.id); });

  /* ---------- ativação e busca ---------- */
  var current = null;

  function activate(it, updateHash){

  function filtrar(){
    var q = norm(buscaEl.value.trim());
    var visiveis = [];

    items.forEach(function(it){
      var headMatch = !q || it.head.indexOf(q) !== -1;
      var algum = false;
      it.blocks.forEach(function(b){
        var ok = !q || headMatch || b.text.indexOf(q) !== -1;
        b.el.hidden = !ok;
        if (ok) algum = true;
      });
      var mostra = !q || headMatch || algum;
      it.btn.hidden = !mostra;
      if (mostra) visiveis.push(it);
    });

    groupEls.forEach(function(g, i){
      g.wrap.hidden = !items.some(function(x){ return x.g === i && !x.btn.hidden; });
    });

    atualizaZonas();
    vazioEl.hidden = visiveis.length > 0;
    contagemEl.textContent = q
      ? (visiveis.length === 1 ? "1 resultado" : visiveis.length + " resultados")
      : "";

    if (!visiveis.length) {
      items.forEach(function(x){ x.panel.hidden = true; });
      current = null;
      return;
    }
    if (!current || current.btn.hidden) {
      activate(visiveis[0], false);
    } else {
      current.panel.hidden = false;
    }
  }

  items.forEach(function(it){
    it.btn.addEventListener("click", function(){ activate(it, true); });
  });

  buscaEl.addEventListener("input", filtrar);

  // Navegação por teclado entre abas visíveis (setas)
  tabsEl.addEventListener("keydown", function(ev){
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    var vis = items.filter(function(x){ return !x.btn.hidden; });
    var idx = vis.indexOf(current);
    if (idx < 0) return;
    var nxt = ev.key === "ArrowRight" ? vis[(idx + 1) % vis.length] : vis[(idx - 1 + vis.length) % vis.length];
    activate(nxt, true);
    nxt.btn.focus();
    ev.preventDefault();
  });

  // Estado inicial: primeira aba ou a indicada no #hash
  filtrar();
  var h = (location.hash || "").replace("#", "");
  var alvo = items.filter(function(x){ return x.id === h; })[0];
  if (alvo) activate(alvo, false);
})();
</script>
</body>
</html>
